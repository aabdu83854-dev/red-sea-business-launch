d Documentation (2025-08-25)"}, {"url": "https://www.meydanfz.ae/blog/essential-documents-import-export-business-dubai", "title": "Meydan Free Zone: Essential documents for import/export in Dubai (Jul 2026)"}]}, {"topic": "restricted", "claim_ar": "ممنوع: أدوات القمار، والمواد المخالفة للعقيدة الإسلامية أو الآداب العامة، والإطارات المستعملة وغيرها. ومقيّد (يحتاج موافقة الجهة المختصة): الألعاب النارية، والأدوية، وأجهزة الإرسال اللاسلكي، والسجائر الإلكترونية، والأغذية ومنتجات العناية الشخصية ومستحضرات التجميل (بلدية دبي في دبي).", "claim_en": "Prohibited: gambling tools, items contradicting Islamic faith or public morals, used tyres, among others. Restricted (need authority approval): fireworks, pharmaceuticals, radio transmitters, e-cigarettes, and food, personal-care and cosmetic products (Dubai Municipality in Dubai).", "sources": [{"url": "https://www.dubaicustoms.gov.ae/en/mobile/Pages/ProhibitedandRestrictedGoods.aspx", "title": "Dubai Customs: Prohibited and Restricted Goods"}, {"url": "https://u.ae/en/information-and-services/finance-and-investment/clearing-the-customs-and-paying-customs-duty", "title": "u.ae: Clearing customs and paying customs duty"}]}, {"topic": "online", "claim_ar": "تخضع التجارة الإلكترونية في الإمارات للمرسوم بقانون اتحادي رقم 14 لسنة 2023 بشأن التجارة عبر وسائل التقنية الحديثة، ويحتاج البائع عبر الإنترنت إلى الترخيص المناسب من دائرة التنمية الاقتصادية في إمارته أو من منطقة حرة. (مسؤولية العميل)", "claim_en": "E-commerce in the UAE is governed by Federal Decree-Law No. 14 of 2023 on trading by modern technological means; online sellers need the appropriate licence from their emirate's economic department or a free zone. (Client's responsibility.)", "sources": [{"url": "https://www.middleeastbriefing.com/news/uae-e-commerce-regulation-and-licensing-requirements/", "title": "Middle East Briefing: UAE e-commerce regulation and licensing (updated Aug 2025)"}, {"url": "https://atblegal.com/blog/empowering-e-commerce-in-the-uae-a-deep-dive-in", "title": "ATB Legal: Federal Decree-Law No. 14/2023"}]}]}, {"code": "qa", "name_ar": "قطر", "name_en": "Qatar", "facts": [{"topic": "importer", "claim_ar": "يجب أن يحمل المستورد ترخيص استيراد ساري المفعول مسجلاً لدى وزارة التجارة والصناعة.", "claim_en": "Importers must hold a valid import licence registered with the Ministry of Commerce and Industry.", "sources": [{"url": "https://www.trade.gov/country-commercial-guides/qatar-import-requirements-and-documentation", "title": "trade.gov: Qatar – Import Requirements and Documentation (2024-07-29)"}, {"url": "https://invest.qa/en/resources/laws-and-regulations/customs", "title": "Invest Qatar: Customs"}]}, {"topic": "duty", "claim_ar": "الرسوم الجمركية العامة 5% من قيمة CIF، مع نسب أعلى لبعض السلع مثل التبغ والكحول (100%).", "claim_en": "General customs duty is 5% of CIF value, with higher rates for some goods such as tobacco and alcohol (100%).", "sources": [{"url": "https://invest.qa/en/resources/laws-and-regulations/customs", "title": "Invest Qatar: Customs"}, {"url": "https://taxsummaries.pwc.com/qatar/corporate/other-taxes", "title": "PwC Tax Summaries: Qatar (reviewed 17 Sep 2026)"}]}, {"topic": "vat", "claim_ar": "لا تفرض قطر حالياً ضريبة قيمة مضافة أو ضريبة مبيعات، ولم يُعلن عن موعد رسمي لتطبيقها (حتى نوفمبر 2026).", "claim_en": "Qatar currently imposes no VAT or sales tax, and no official implementation date has been announced (as of November 2026).", "sources": [{"url": "https://taxsummaries.pwc.com/qatar/corporate/other-taxes", "title": "PwC Tax Summaries: Qatar (reviewed 17 Sep 2026)"}, {"url": "https://www.mbgcorp.com/qatar/insights/qatar-vat-implementation-date/", "title": "MBG: Qatar VAT implementation date (Jun 2026)"}]}, {"topic": "conformity", "claim_ar": "تحتاج بعض المنتجات الخاضعة للوائح (مثل المكاوي الكهربائية ومجففات الشعر ومراوح الشفط وأحزمة الأمان وإطارات السيارات) إلى شهادة مطابقة لكل شحنة، ولا تُفسح بدونها.", "claim_en": "Some regulated products (e.g. electric irons, hair dryers, exhaust fans, safety belts, vehicle tyres) need a certificate of conformity per shipment and are not cleared without it.", "sources": [{"url": "https://www.intertek.com/government/product-conformity/certificate-of-conformity-for-exports-to-qatar/", "title": "Intertek: Certificate of Conformity for exports to Qatar"}, {"url": "https://www.gulf-times.com/story/338765/Qatar-introduces-new-regulations-for-cargo-import", "title": "Gulf Times: Qatar introduces new regulations for cargo import (2013)"}]}, {"topic": "documents", "claim_ar": "المستندات: بيان جمركي مفصل، وبوليصة شحن، وشهادة منشأ رسمية، وفاتورة تجارية رسمية مصدّقة من غرفة التجارة، وقائمة تعبئة، وترخيص الاستيراد. ويجب كتابة رمز HS في الفاتورة وشهادة المنشأ، وإلا لا تُقبل الشحنة للتخليص.", "claim_en": "Documents: detailed customs declaration, bill of lading, official certificate of origin, official commercial invoice attested by a chamber of commerce, packing list, and import licence. The HS code must appear on the invoice and certificate of origin, or the shipment is not accepted for clearance.", "sources": [{"url": "https://www.trade.gov/country-commercial-guides/qatar-import-requirements-and-documentation", "title": "trade.gov: Qatar – Import Requirements and Documentation (2024-07-29)"}, {"url": "https://invest.qa/en/resources/laws-and-regulations/customs", "title": "Invest Qatar: Customs"}, {"url": "https://www.gulf-times.com/story/338765/Qatar-introduces-new-regulations-for-cargo-import", "title": "Gulf Times (2013)"}]}, {"topic": "labelling", "claim_ar": "يجب أن تحمل كل قطعة وكل كرتونة علامة «بلد المنشأ» أو «صُنع في» بشكل غير قابل للإزالة، وأن تطابق الفاتورة وشهادة المنشأ، وإلا قد تُعاد الشحنة.", "claim_en": "Each piece and each carton must carry a non-removable 'Country of origin' or 'Made in' marking that matches the invoice and certificate of origin, or the shipment may be returned.", "sources": [{"url": "https://www.trade.gov/country-commercial-guides/qatar-import-requirements-and-documentation", "title": "trade.gov: Qatar – Import Requirements and Documentation (2024-07-29)"}, {"url": "https://www.gulf-times.com/story/338765/Qatar-introduces-new-regulations-for-cargo-import", "title": "Gulf Times (2013)"}]}, {"topic": "online", "claim_ar": "يشترط القرار رقم 25 لسنة 2026 الحصول مسبقاً على ترخيص تجارة إلكترونية من وزارة التجارة والصناعة، ويجب أن يكون المتقدم مسجلاً في السجل التجاري، مع ترخيص منفصل لكل موقع أو منصة. ولا يشمل القرار البيع للاستخدام الشخصي بكميات غير تجارية. (مسؤولية العميل)", "claim_en": "Decision No. 25 of 2026 requires a prior e-commerce licence from MOCI; the applicant must be in the commercial registry, with a separate licence for each website or platform. Personal-use, non-commercial sales are excluded. (Client's responsibility.)", "sources": [{"url": "https://www.tamimi.com/news/qatar-introduces-new-licensing-requirements-for-e-commerce-activities/", "title": "Al Tamimi: Qatar introduces new e-commerce licensing (Mar 2026)"}, {"url": "https://crowell.com/en/insights/client-alerts/qatar-introduces-licensing-framework-for-e-commerce-activities-without-a-physical-premises", "title": "Crowell: Qatar e-commerce licensing framework"}]}]}, {"code": "bh", "name_ar": "البحرين", "name_en": "Bahrain", "facts": [{"topic": "importer", "claim_ar": "يُعِدّ المستورد أو ممثله المفوض أو المخلّص الجمركي المرخّص البيان الجمركي إلكترونياً قبل الاستيراد، ويُنصح بالاستعانة بمخلّص جمركي مرخّص.", "claim_en": "The importer, an authorised representative or a licensed customs broker completes the customs declaration electronically before import; using a licensed clearing agent is recommended.", "sources": [{"url": "https://www.trade.gov/country-commercial-guides/bahrain-import-requirements-and-documentation", "title": "trade.gov: Bahrain – Import Requirements and Documentation (2025-12-01)"}, {"url": "https://www.bahraincustoms.gov.bh/en/trade/commercial-import", "title": "Bahrain Customs: Commercial import"}]}, {"topic": "importer", "claim_ar": "تطلب الجمارك إثبات نشاط المستورد، وعملياً يُطلب سجل تجاري ساري يتضمن نشاط الاستيراد والتصدير.", "claim_en": "Customs requires evidence of the importer's activity; in practice a valid Commercial Registration (CR) with import/export activity is requested.", "sources": [{"url": "https://www.bahraincustoms.gov.bh/en/trade/commercial-import", "title": "Bahrain Customs: Commercial import"}, {"url": "https://www.fedex.com/content/dam/fedex/international/guides/FedEx_Import_Guide_IQ.pdf", "title": "FedEx Import Guide (Bahrain section)"}]}, {"topic": "duty", "claim_ar": "الرسوم الجمركية العامة 5% من قيمة CIF، مع نسب أعلى بكثير على الكحول والسجائر.", "claim_en": "General customs duty is 5% of CIF value, with much higher rates on alcohol and cigarettes.", "sources": [{"url": "https://taxsummaries.pwc.com/bahrain/corporate/other-taxes", "title": "PwC Tax Summaries: Bahrain (reviewed 26 Jul 2026)"}, {"url": "https://icp.gov.ae/en/customs-union-for-gcc-states", "title": "ICP: Customs Union for GCC States"}]}, {"topic": "vat", "claim_ar": "المعدل الأساسي لضريبة القيمة المضافة في البحرين 10% منذ 1 يناير 2022، وتُطبق على استيراد السلع.", "claim_en": "Bahrain's standard VAT rate is 10% since 1 January 2022 and applies to imports of goods.", "sources": [{"url": "https://taxsummaries.pwc.com/bahrain/corporate/other-taxes", "title": "PwC Tax Summaries: Bahrain (reviewed 26 Jul 2026)"}, {"url": "https://assets.kpmg.com/content/dam/kpmg/bh/pdf/2022/01/bahrain-tax-alert-impact-of-vat-rate-change-on-import-of-goods-and-services.pdf", "title": "KPMG: Bahrain VAT rate change on imports (Jan 2022)"}]}, {"topic": "conformity", "claim_ar": "تفحص إدارة المواصفات والمقاييس المنتجات الخاضعة للوائح عند الاستيراد. مثلاً: الأجهزة الكهربائية وألعاب الأطفال تحتاج شهادة فحص نوع خليجية وإقرار مطابقة من المستورد، والأكياس البلاستيكية تحتاج ترخيصاً من المجلس الأعلى للبيئة. وتدخل معظم السلع الأخرى دون هذا الفحص.", "claim_en": "Bahrain's standards directorate checks regulated products on import. For example, electrical appliances and children's toys need a GCC type examination certificate and an importer's declaration of conformity, and plastic bags need a licence from the Supreme Council for Environment. Most other goods are not screened this way.", "sources": [{"url": "https://www.trade.gov/country-commercial-guides/bahrain-standards-trade", "title": "trade.gov: Bahrain – Standards for Trade (2024-05-08)"}, {"url": "https://image.mfa.go.th/mfa/0/qcuTAU8W4b/เอกสาร/Import_Requirements_for_Regulated_Product_by_Testing_and_Metrology_Directorate_-_December_2022.pdf", "title": "Bahrain Testing and Metrology Directorate: Import requirements for regulated products (Dec 2022)"}]}, {"topic": "documents", "claim_ar": "يُرفق بالبيان الجمركي الفاتورة التجارية وأصل بوليصة الشحن. ولا تُشترط شهادة المنشأ عادةً إلا عند طلب الإعفاء الجمركي، ويُفضّل ذكر رمز HS وبلد المنشأ في الفاتورة.", "claim_en": "The customs declaration is accompanied by the commercial invoice and the original bill of lading. A certificate of origin is generally needed only to claim duty exemption; the invoice should show HS codes and country of origin.", "sources": [{"url": "https://www.bahraincustoms.gov.bh/en/trade/commercial-import", "title": "Bahrain Customs: Commercial import"}, {"url": "https://www.fedex.com/content/dam/fedex/international/guides/FedEx_Import_Guide_IQ.pdf", "title": "FedEx Import Guide (Bahrain section)"}]}, {"topic": "restricted", "claim_ar": "يُمنع أو يُقيّد في البحرين استيراد عدة سلع منها: الإطارات المستعملة، واللؤلؤ المستزرع، والمواد المحتوية على الأسبستوس، والطائرات النموذجية المتحكم بها لاسلكياً.", "claim_en": "Bahrain bans or restricts imports of items including used tyres, cultured pearls, asbestos-containing products and radio-controlled model aircraft.", "sources": [{"url": "https://www.trade.gov/country-commercial-guides/bahrain-prohibited-and-restricted-imports", "title": "trade.gov: Bahrain – Prohibited and Restricted Imports (2025-12-01)"}, {"url": "https://qr.wto.org/en/notification/1195", "title": "WTO QR notification: Bahrain (2019)"}]}, {"topic": "online", "claim_ar": "يجب على أصحاب الأعمال إدخال رابط متجرهم الإلكتروني بدقة في نظام التسجيل لدى وزارة الصناعة والتجارة، ويُمنع المرخص لهم من بيع منتجات تحتاج موافقة جهات حكومية أخرى عبر المتجر الافتراضي. (مسؤولية العميل)", "claim_en": "Business owners must accurately enter their e-store link in MOIC's registration system; licensees may not sell products needing approval from other government agencies through a virtual store. (Client's responsibility.)", "sources": [{"url": "https://moic.gov.bh/en/node/5807", "title": "MOIC news (22 Jan 2025)"}, {"url": "https://www.lexis.ae/2025/01/30/bahrain-enforces-strict-ecommerce-compliance-rules/", "title": "LexisNexis ME: Bahrain enforces strict e-commerce rules (30 Jan 2025)"}]}]}, {"code": "om", "name_ar": "عُمان", "name_en": "Oman", "facts": [{"topic": "importer", "claim_ar": "تُقدَّم البيانات الجمركية وتصاريح السلع المقيدة إلكترونياً عبر نظام «بيان».", "claim_en": "Customs declarations, and permits for restricted goods, are filed electronically through the Bayan system.", "sources": [{"url": "https://customs.gov.om/en/business-services/procedural_services/request-to-apply-a-custom-declaration/", "title": "Oman Customs: Request to apply a customs declaration"}, {"url": "https://www.jas.com/oman-customs-documentation-requirements/", "title": "JAS: Oman customs documentation requirements"}]}, {"topic": "duty", "claim_ar": "الرسوم الجمركية الأساسية 5% من قيمة CIF لمعظم الواردات من خارج دول الخليج، ما لم تنطبق اتفاقية تجارة حرة.", "claim_en": "The standard customs duty is 5% of CIF value for most non-GCC imports, unless a free-trade agreement applies.", "sources": [{"url": "https://taxsummaries.pwc.com/oman/corporate/other-taxes", "title": "PwC Tax Summaries: Oman (reviewed 7 Jul 2026)"}, {"url": "https://icp.gov.ae/en/customs-union-for-gcc-states", "title": "ICP: Customs Union for GCC States"}]}, {"topic": "vat", "claim_ar": "المعدل الأساسي لضريبة القيمة المضافة في عُمان 5%، وطُبقت منذ 16 أبريل 2021.", "claim_en": "Oman's standard VAT rate is 5%, introduced on 16 April 2021.", "sources": [{"url": "https://taxsummaries.pwc.com/oman/corporate/other-taxes", "title": "PwC Tax Summaries: Oman (reviewed 7 Jul 2026)"}, {"url": "https://www.khaleejtimes.com/world/gulf/oman-rolls-out-5-vat-on-most-goods-and-services?amp=1", "title": "Khaleej Times: Oman rolls out 5% VAT (16 Apr 2021)"}]}, {"topic": "conformity", "claim_ar": "بموجب القرار الوزاري 190/2021 (نظام المطابقة)، تطبق عُمان على مراحل اشتراط شهادات مطابقة لفئات منتجات خاضعة للوائح، منها: الأجهزة الكهربائية منخفضة الجهد، والمواد الملامسة للأغذية، والمنظفات، ومستلزمات الأطفال، ومستحضرات التجميل. بدأت المرحلة الأولى في 1 مارس 2025، وتصدر الشهادات جهات معتمدة لدى المديرية العامة للمواصفات والمقاييس.", "claim_en": "Under Ministerial Decision 190/2021 (conformity scheme), Oman is phasing in certification for regulated product categories, including low-voltage electrical appliances, food-contact materials, detergents, childcare articles and cosmetics. Stage 1 started on 1 March 2025; certificates are issued by bodies notified by the DGSM.", "sources": [{"url": "https://www.productcomplianceinstitute.com/2024/12/19/oman-regulated-products-under-technical-regulation-on-conformity-scheme/", "title": "Product Compliance Institute: Oman regulated products under conformity scheme (Dec 2024)"}, {"url": "https://www.tuv.com/regulations-and-standards/en/oman-product-categories-under-the-technical-regulation-on-conformity-scheme-omani-ministerial-decree-190-202.html", "title": "TÜV Rheinland: Oman product categories under MD 190/2021"}]}, {"topic": "documents", "claim_ar": "مستندات البيان الجمركي: فاتورة تجارية (تتضمن رمز HS وبلد المنشأ)، وشهادة منشأ من بلد التصنيع، وإقرار صادر من بلد التصدير، وقائمة تعبئة، وبوليصة شحن، إضافة إلى أي تصاريح مطلوبة للسلعة.", "claim_en": "Customs declaration documents: commercial invoice (showing HS code and country of origin), certificate of origin from the manufacturing country, a declaration issued by the exporting country, packing list and bill of lading, plus any permits the goods require.", "sources": [{"url": "https://customs.gov.om/en/business-services/procedural_services/request-to-apply-a-custom-declaration/", "title": "Oman Customs: Request to apply a customs declaration"}, {"url": "https://www.jas.com/oman-customs-documentation-requirements/", "title": "JAS: Oman customs documentation requirements"}]}, {"topic": "restricted", "claim_ar": "حذّرت الجمارك العُمانية المسافرين من إدخال: المسدسات والبنادق اللعبة المشابهة للحقيقية، وأجهزة الصعق الكهربائي، والسلع المقلدة أو المزورة، والسلع غير المطابقة للمواصفات أو المخالفة لحقوق الملكية الفكرية، والملابس المشابهة للزي العسكري.", "claim_en": "Oman Customs warned travellers against bringing: toy guns resembling real weapons, stun guns/tasers, counterfeit or forged goods, goods failing approved specifications or infringing IP, and military-style clothing.", "sources": [{"url": "https://www.onmanorama.com/travel/travel-news/2026/07/16/oman-customs-warns-against-prohibited-items.html", "title": "Onmanorama: Oman Customs warns against prohibited items (16 Jul 2026)"}, {"url": "https://www.omanobserver.om/ampArticle/1192899", "title": "Oman Observer: Travelling to Oman – prohibited goods (15 Jul 2026)"}]}, {"topic": "online", "claim_ar": "يجب على من يمارس التجارة الإلكترونية في عُمان الحصول على الترخيص عبر منصة «عُمان للأعمال» وربط المتجر بالسجل التجاري، وفق لائحة التجارة الإلكترونية الصادرة بالقرار الوزاري 499/2023. (مسؤولية العميل)", "claim_en": "E-commerce businesses in Oman must obtain a licence via the Oman Business Platform and link the store to their commercial registration, under the e-commerce regulation issued by Ministerial Decision 499/2023. (Client's responsibility.)", "sources": [{"url": "https://www.omanobserver.om/ampArticle/1168791", "title": "Oman Observer: All e-commerce activities must follow procedures – MOCIIP (9 Apr 2025)"}, {"url": "https://www.omanobserver.om/ampArticle/1149248", "title": "Oman Observer: Oman begins implementation of e-commerce regulations (5 Feb 2024)"}]}]}, {"code": "ye", "name_ar": "اليمن", "name_en": "Yemen", "facts": [{"topic": "importer", "claim_ar": "تنبيه: اليمن منقسم؛ فالمناطق الخاضعة للحكومة (مثل عدن) تطبق إجراءات جمركية وأسعار صرف مختلفة عن المناطق الخاضعة للحوثيين (مثل ميناء الحديدة). يجب على العميل التأكد من المتطلبات حسب منفذ الدخول.", "claim_en": "Caution: Yemen is split; government-controlled areas (e.g. Aden) apply different customs procedures and exchange rates from Houthi-held areas (e.g. Hodeidah port). The client must confirm requirements for the port of entry.", "sources": [{"url": "https://www.newarab.com/news/yemens-government-raises-customs-exchange-rate-50?amp", "title": "The New Arab (11 Jan 2023)"}, {"url": "https://www.agbi.com/article/yemen-raises-customs-duties-by-50-on-non-essential-goods", "title": "AGBI: Yemen raises customs duties by 50% on non-essential goods"}]}, {"topic": "duty", "claim_ar": "في مناطق الحكومة رُفع سعر الدولار الجمركي للسلع غير الأساسية من 250 إلى 500 ريال (يوليو 2021)، ثم إلى 750 ريالاً (يناير 2023)، وفي مايو 2026 جرى تحرير سعر الصرف الجمركي (وأُفيد بأنه نحو 1550 ريالاً للدولار)، مما يرفع قيمة الرسوم بالريال. ويبقى القمح والأرز والأدوية المسجلة معفاة.", "claim_en": "In government areas the customs USD exchange rate for non-essential goods rose from YER 250 to 500 (July 2021), then to 750 (January 2023); in May 2026 the customs exchange rate was liberalised (reported at about YER 1,550 per USD), raising duties in rials. Wheat, rice and registered medicines remain exempt.", "sources": [{"url": "https://english.aawsat.com/home/article/3100826/yemen-government-doubles-customs-fees-100", "title": "Asharq Al-Awsat: Yemen government doubles customs fees (Jul 2021)"}, {"url": "https://www.newarab.com/news/yemens-government-raises-customs-exchange-rate-50?amp", "title": "The New Arab (11 Jan 2023)"}, {"url": "https://sanaacenter.org/the-yemen-review/april-june-2026/28066", "title": "Sanaa Center: Yemen Review April-June 2026"}, {"url": "https://www.yemenmonitor.com/en/Details/ArtMID/908/ArticleID/172272", "title": "Yemen Monitor: basic commodities exempted from customs rate liberalisation (21 May 2026)"}, {"url": "https://south24.net/news/news.php?nid=5538", "title": "South24: customs dollar liberalisation (2026)"}]}, {"topic": "vat", "claim_ar": "يطبق اليمن ضريبة مبيعات عامة بنسبة 5% على معظم السلع المستوردة، يدفعها المستورد عند التخليص الجمركي.", "claim_en": "Yemen applies a 5% General Sales Tax to most imported goods, paid by the importer at customs clearance.", "sources": [{"url": "https://grantthornton.global/en/insights/indirect-tax-guide/indirect-tax---Yemen", "title": "Grant Thornton: Indirect tax guide – Yemen"}, {"url": "https://www.stackry.com/duties-and-taxes/yemen", "title": "Stackry: Yemen duties and taxes"}]}, {"topic": "conformity", "claim_ar": "وفق القانون رقم 44 لسنة 1999 بشأن المواصفات والمقاييس وضبط الجودة: لا تُفرج الجمارك عن السلع المستوردة ما لم تكن مطابقة للمواصفات المعتمدة ومرفقة بشهادة مطابقة من بلد المنشأ. ويُعاد تصدير السلع غير المطابقة على نفقة المستورد خلال 15 يوماً من إخطاره أو تُتلف، مع عقوبات تشمل السجن أو الغرامة.", "claim_en": "Under Law No. 44 of 1999 on standards, metrology and quality control, customs must not release imports unless they conform to approved standards and come with a certificate of conformity from the country of origin. Non-conforming goods are re-exported at the importer's cost within 15 days of notice or destroyed; penalties include prison or fines.", "sources": [{"url": "https://www.mohamah.net/law/?p=62270", "title": "Mohamah.net: text of Law No. 44 of 1999"}, {"url": "https://humanrts.umn.edu/arabic/Yemeni_Laws/Yemeni_Laws91.pdf", "title": "University of Minnesota: Yemeni Law No. 44 of 1999 (Official Gazette text)"}]}, {"topic": "conformity", "claim_ar": "تشمل اللائحة الفنية الخليجية لألعاب الأطفال (علامة G-Mark) اليمن إلى جانب دول الخليج الست.", "claim_en": "The Gulf Technical Regulation for Children's Toys (G-Mark) applies in Yemen as well as the six GCC states.", "sources": [{"url": "https://www.gso.org.sa/wp-content/uploads/2022/11/G-Mark_HS_Toys_Guidance_V1_English.pdf", "title": "GSO: G-Mark toys guidance"}, {"url": "https://www.qima.com/gmark-certification", "title": "QIMA: G-Mark certification"}]}, {"topic": "documents", "claim_ar": "منذ بداية 2025 أصبح «الإقرار المسبق للبضائع» (ACD) إلزامياً للشحنات المتجهة إلى الموانئ اليمنية، ويحصل عليه الشاحن أو المصدّر أو وكيل الشحن من ميناء التحميل، ويُكتب رقمه على بوليصة الشحن. الشحنات المخالفة معرضة للتأخير أو المصادرة أو الإعادة.", "claim_en": "Since early 2025 an Advance Cargo Declaration (ACD) is mandatory for shipments to Yemeni ports; the shipper, exporter or forwarder obtains it at the port of loading and its number is written on the bill of lading. Non-compliant shipments risk delay, confiscation or return.", "sources": [{"url": "https://www.yeniyemen.net/en/p-281544", "title": "Yeni Yemen (3 Feb 2025)"}, {"url": "https://scktr.com/en/acd-will-be-mandatory-for-all-shipments-to-yemen-ports", "title": "SCKTR: ACD mandatory for all shipments to Yemen ports"}]}, {"topic": "labelling", "claim_ar": "يعاقب القانون رقم 44 لسنة 1999 على استيراد سلع لا تحمل البيانات الإيضاحية التي تحددها هيئة المواصفات والمقاييس؛ ولا يحدد نص القانون اللغة صراحة.", "claim_en": "Law No. 44 of 1999 penalises importing goods without the explanatory label data set by the standards authority (YSMO); the law text does not specify the language.", "sources": [{"url": "https://www.mohamah.net/law/?p=62270", "title": "Mohamah.net: text of Law No. 44 of 1999"}, {"url": "https://humanrts.umn.edu/arabic/Yemeni_Laws/Yemeni_Laws91.pdf", "title": "University of Minnesota: Yemeni Law No. 44 of 1999"}]}]}, {"code": "eg", "name_ar": "مصر", "name_en": "Egypt", "facts": [{"topic": "importer", "claim_ar": "الاستيراد بغرض الاتجار في مصر يتطلب القيد في سجل المستوردين لدى الهيئة العامة للرقابة على الصادرات والواردات (GOEIC) وفق القانون 121 لسنة 1982. الشركات الإنتاجية أو الخدمية التي تستورد باسمها لاستخدامها الخاص (وليس لإعادة البيع) معفاة.", "claim_en": "Importing for trade in Egypt requires registration in the Importers Register kept by GOEIC under Law 121 of 1982. Production or service companies importing in their own name for their own use (not resale) are exempt.", "sources": [{"url": "https://www.mondaq.com/international-trade-investment/1808754/the-legal-framework-for-commercial-importing-into-egypt", "title": "The Legal Framework for Commercial Importing into Egypt (Andersen via Mondaq, 2026)"}, {"url": "https://eg.andersen.com/wp-content/uploads/2026/06/Law-No.-121-of-1982.pdf", "title": "Law No. 121 of 1982 on the Importers Register (English translation, Andersen)"}]}, {"topic": "importer", "claim_ar": "القاعدة العامة في سجل المستوردين: يجب أن تكون الشركة مملوكة لمصريين بنسبة 51% على الأقل. لكن القانون 173 لسنة 2023 يسمح استثناءً بقيد الشركات الأجنبية أو التي تقل فيها الملكية المصرية عن 51% لمدة محدودة (حتى 10 سنوات، قابلة للتمديد مرة واحدة بقرار من مجلس الوزراء). وفي يوليو 2026 صدرت لائحة تنفيذية جديدة للقانون (القرار الوزاري 271 لسنة 2026)، وستنتقل طلبات القيد والتجديد إلى منصة إلكترونية.", "claim_en": "General rule: companies on the Importers Register must be at least 51% Egyptian-owned. As an exception, Law 173/2023 lets foreign-owned or under-51%-Egyptian companies register for a limited period (up to 10 years, extendable once by Cabinet decree). New executive regulations were issued in July 2026 (Ministerial Decree 271/2026), and registration/renewal will move to an electronic platform.", "sources": [{"url": "https://www.bakermckenzie.com/en/insight/publications/2026/07/egypt-temporary-importer-registration-for-foreign-companies", "title": "Egypt: Temporary Importer Registration for Foreign Companies (Baker McKenzie, July 2026)"}, {"url": "https://www.pwc.com/m1/en/services/tax/middle-east-tax-news-alerts/2026/egypt-issues-a-new-executive-regulation-for-the-importers-register.html", "title": "Egypt issues a new Executive Regulation for the Importers Register (PwC, 27 July 2026)"}, {"url": "https://www.mondaq.com/inward-foreign-investment/1441724/new-import-regulations-a-legal-analysis-of-law-no-173-of-2023", "title": "New Import Regulations: A Legal Analysis of Law No. 173 of 2023 (Mondaq)"}, {"url": "https://eg.andersen.com/wp-content/uploads/2026/06/Law-No.-121-of-1982.pdf", "title": "Law No. 121 of 1982 on the Importers Register (English translation, Andersen)"}]}, {"topic": "duty", "claim_ar": "الرسوم الجمركية في مصر تتراوح عادة بين 0% و60% من قيمة البضاعة CIF، وتُطبق نسب أعلى على بعض السلع مثل سيارات الركوب (قد تصل إلى 135%).", "claim_en": "Egyptian customs duties generally range from 0% to 60% of CIF value; higher rates apply to some goods such as passenger cars (up to 135%).", "sources": [{"url": "https://taxsummaries.pwc.com/egypt/corporate/other-taxes", "title": "Egypt - Corporate - Other taxes (PwC, reviewed 17 Aug 2026)"}, {"url": "https://www.gtai.de/de/trade/aegypten/zoll/zoelle-und-einfuhrabgaben-546124", "title": "Ägypten: Zölle und Einfuhrabgaben (GTAI, 2023)"}]}, {"topic": "vat", "claim_ar": "ضريبة القيمة المضافة في مصر 14% على معظم السلع والخدمات، مع سعر مخفض 5% لبعض الآلات والمعدات الرأسمالية.", "claim_en": "Egypt's standard VAT is 14% on most goods and services, with a reduced 5% rate for some capital machinery and equipment.", "sources": [{"url": "https://taxsummaries.pwc.com/egypt/corporate/other-taxes", "title": "Egypt - Corporate - Other taxes (PwC, reviewed 17 Aug 2026)"}, {"url": "https://www.avalara.com/vatlive/en/country-guides/africa-and-middle-east/egypt-vat/egyptian-vat-rates.html", "title": "Egyptian VAT rates (Avalara VATlive)"}]}, {"topic": "documents", "claim_ar": "نظام التسجيل المسبق للشحنات (ACI): يقدّم المستورد المصري الطلب عبر منصة نافذة ويحصل على رقم ACID، ويجب أن يظهر هذا الرقم على كل مستندات الشحنة. النظام إلزامي للشحن البحري منذ أكتوبر 2021.", "claim_en": "Advance Cargo Information (ACI): the Egyptian importer applies via the Nafeza platform and gets an ACID number, which must appear on all shipping documents. Mandatory for sea freight since October 2021.", "sources": [{"url": "https://www.trade.gov/knowledge-product/egypt-import-requirements-documentation", "title": "Egypt - Import Requirements and Documentation (trade.gov, 2025-11-21)"}, {"url": "https://www.aeb.com/de/magazin/artikel/aegypten-cargox-aci-seefracht-luftfracht.php", "title": "Ägypten: ACI und CargoX (AEB)"}, {"url": "https://www.agroberichtenbuitenland.nl/actueel/nieuws/2026/02/12/mandatory-aci-implementation-for-air-freight-to-egypt", "title": "Mandatory ACI implementation for air freight to Egypt (Netherlands agricultural attache, Feb 2026)"}]}, {"topic": "documents", "claim_ar": "يجب على المصدّر الأجنبي (المورد في الصين مثلاً) التسجيل في منصة CargoX ورفع مستندات الشحن إلكترونياً. الشحنات غير الملتزمة بنظام ACI لا يُسمح بدخولها إلى مصر.", "claim_en": "The foreign exporter (e.g. the supplier in China) must register on the CargoX platform and upload the shipping documents electronically. Shipments not complying with ACI are not allowed into Egypt.", "sources": [{"url": "https://aegypten.ahk.de/en/news2/egypt-to-enforce-mandatory-aci-for-air-freight-starting-january-1-2026", "title": "Egypt to enforce mandatory ACI for air freight starting January 1, 2026 (AHK Egypt)"}, {"url": "https://www.aeb.com/de/magazin/artikel/aegypten-cargox-aci-seefracht-luftfracht.php", "title": "Ägypten: ACI und CargoX (AEB)"}, {"url": "https://www.agroberichtenbuitenland.nl/actueel/nieuws/2026/02/12/mandatory-aci-implementation-for-air-freight-to-egypt", "title": "Mandatory ACI implementation for air freight to Egypt (Netherlands agricultural attache, Feb 2026)"}]}, {"topic": "documents", "claim_ar": "أصبح نظام ACI إلزامياً لكل الشحنات الجوية إلى مصر اعتباراً من 1 يناير 2026، مع رفع المستندات عبر CargoX قبل الشحن.", "claim_en": "ACI has been mandatory for all air freight to Egypt since 1 January 2026, with documents uploaded via CargoX before dispatch.", "sources": [{"url": "https://aegypten.ahk.de/en/news2/egypt-to-enforce-mandatory-aci-for-air-freight-starting-january-1-2026", "title": "Egypt to enforce mandatory ACI for air freight starting January 1, 2026 (AHK Egypt)"}, {"url": "https://www.agroberichtenbuitenland.nl/actueel/nieuws/2026/02/12/mandatory-aci-implementation-for-air-freight-to-egypt", "title": "Mandatory ACI implementation for air freight to Egypt (Netherlands agricultural attache, Feb 2026)"}]}, {"topic": "conformity", "claim_ar": "وفق القرار الوزاري 43 لسنة 2016 (المعدّل في 2022)، لا يُفرج بغرض الاتجار عن سلع 25 مجموعة إلا إذا كانت من مصانع أو أصحاب علامات تجارية مسجلين لدى GOEIC. من هذه المجموعات: أدوات المائدة والمطبخ، الأدوات الزجاجية، الأجهزة المنزلية، الأثاث المنزلي والمكتبي، لعب الأطفال، الملابس والأقمشة، السجاد، وحدات الإنارة المنزلية، مستحضرات التجميل، الصابون والمنظفات، الساعات، الأحذية.", "claim_en": "Under Ministerial Decree 43/2016 (amended 2022), goods in 25 product groups may be cleared for trade only if made by GOEIC-registered factories or trademark owners. Groups include tableware and kitchen utensils, glassware, household appliances, home and office furniture, children's toys, clothing and fabrics, rugs, household lighting, cosmetics, soap and detergents, watches and footwear.", "sources": [{"url": "https://www.agroberichtenbuitenland.nl/binaries/agroberichtenbuitenland/documenten/publicaties/2022/02/01/decree-43-on-anti-dumping/decree-no-43-2016-english.pdf", "title": "Ministerial Decree 43/2016 (English translation)"}, {"url": "https://www.trade.gov/country-commercial-guides/egypt-trade-barriers", "title": "Egypt - Trade Barriers (trade.gov, 2025-11-21)"}, {"url": "https://tamimi.com/news/egypt-registration-mandatory-for-foreign-factories-and-trademark-owning-companies", "title": "Egypt: Registration mandatory for foreign factories and trademark-owning companies (Al Tamimi)"}, {"url": "https://cdn1-verigates.bureauveritas.com/sites/verigates/files/2023-01/EGYPT%20%28VOC%29%20Datasheet%20Rev%205.4.pdf", "title": "Egypt (VOC) Datasheet Rev 5.4 (Bureau Veritas, 2023)"}]}, {"topic": "conformity", "claim_ar": "يتطلب تسجيل المصنع لدى GOEIC: طلب تسجيل، وما يثبت الكيان القانوني للمصنع وترخيصه، وقائمة المنتجات والعلامات التجارية، وشهادة نظام جودة صادرة من جهة معترف بها من ILAC أو IAF. يجب أن تكون المستندات مصدّقة (اسأل GOEIC عن طريقة التصديق المطلوبة).", "claim_en": "GOEIC factory registration requires an application, proof of the factory's legal identity and licence, the product and trademark list, and a quality-system certificate from an ILAC- or IAF-recognised body. Documents must be certified (check the exact certification route with GOEIC).", "sources": [{"url": "https://www.trade.gov/country-commercial-guides/egypt-trade-barriers", "title": "Egypt - Trade Barriers (trade.gov, 2025-11-21)"}, {"url": "https://tamimi.com/news/egypt-registration-mandatory-for-foreign-factories-and-trademark-owning-companies", "title": "Egypt: Registration mandatory for foreign factories and trademark-owning companies (Al Tamimi)"}, {"url": "https://aegypten.ahk.de/en/services/legal-advisory/registration-of-manufacturers", "title": "Registration of Manufacturers (AHK Egypt)"}]}, {"topic": "labelling", "claim_ar": "يجب أن تحمل السلع المستوردة للبيع في مصر بيانات باللغة العربية، منها بلد المنشأ. ولبعض الفئات (مثل الملابس والمفروشات والسجاد) شروط إضافية.", "claim_en": "Goods imported for sale in Egypt must carry Arabic labelling, including country of origin. Some categories (e.g. garments, linens, rugs) have extra requirements.", "sources": [{"url": "https://www.trade.gov/country-commercial-guides/egypt-labelingmarking-requirements", "title": "Egypt - Labeling/Marking Requirements (trade.gov, 2025-11-21)"}, {"url": "https://cdn1-verigates.bureauveritas.com/sites/verigates/files/2023-01/EGYPT%20%28VOC%29%20Datasheet%20Rev%205.4.pdf", "title": "Egypt (VOC) Datasheet Rev 5.4 (Bureau Veritas, 2023)"}]}, {"topic": "restricted", "claim_ar": "السلع المستعملة والمجددة ممنوعة أو مقيدة عموماً عند الاستيراد إلى مصر.", "claim_en": "Used and refurbished goods are generally banned or restricted for import into Egypt.", "sources": [{"url": "https://www.trade.gov/country-commercial-guides/egypt-prohibited-restricted-imports", "title": "Egypt - Prohibited and Restricted Imports (trade.gov, 2025-11-21)"}, {"url": "https://cdn1-verigates.bureauveritas.com/sites/verigates/files/2023-01/EGYPT%20%28VOC%29%20Datasheet%20Rev%205.4.pdf", "title": "Egypt (VOC) Datasheet Rev 5.4 (Bureau Veritas, 2023)"}]}]}, {"code": "sy", "name_ar": "سوريا", "name_en": "Syria", "facts": [{"topic": "restricted", "claim_ar": "العقوبات الأمريكية: أنهى الأمر التنفيذي 14312 العقوبات الأمريكية الشاملة على سوريا اعتباراً من 1 يوليو 2025، وأزالت OFAC لوائح العقوبات السورية في 26 أغسطس 2025. ومنذ 2 سبتمبر 2025 يُسمح بتصدير معظم السلع المدنية العادية (EAR99) إلى سوريا عبر استثناء الترخيص SPP بشروط، وما زال هذا الإطار سارياً حتى نوفمبر 2026.", "claim_en": "US sanctions: EO 14312 ended comprehensive US sanctions on Syria from 1 July 2025; OFAC removed the Syrian Sanctions Regulations on 26 Aug 2025. Since 2 Sept 2025 most ordinary civilian (EAR99) items may be exported to Syria under License Exception SPP, with conditions; this framework still applied as of Nov 2026.", "sources": [{"url": "https://www.mayerbrown.com/zh-hans/insights/publications/2025/09/united-states-substantially-relaxes-export-controls-on-syria-following-lifting-of-comprehensive-sanctions", "title": "United States Substantially Relaxes Export Controls on Syria (Mayer Brown, Sept 2025)"}, {"url": "https://www.bis.gov/licensing/country-guidance/syria-export-controls", "title": "Syria Export Controls (BIS)"}, {"url": "https://www.steptoe.com/en/news-publications/international-compliance-blog/us-rescinds-syrias-state-sponsor-of-terrorism-designation.html", "title": "US Rescinds Syria's State Sponsor of Terrorism Designation (Steptoe, Aug 2026)"}]}, {"topic": "restricted", "claim_ar": "أُلغي قانون قيصر الأمريكي في ديسمبر 2025 ضمن قانون تفويض الدفاع الوطني للسنة المالية 2026، مع مراجعة دورية كل 180 يوماً لمدة أربع سنوات وإمكانية فرض عقوبات على أفراد.", "claim_en": "The US Caesar Act was repealed in December 2025 through the FY2026 NDAA, with a 180-day review over four years and possible sanctions on individuals.", "sources": [{"url": "https://www.thenationalnews.com/news/mena/2025/12/20/syria-welcomes-repeal-of-sweeping-us-sanctions", "title": "Syria welcomes repeal of sweeping US sanctions (The National, 20 Dec 2025)"}, {"url": "https://sanctionsnews.bakermckenzie.com/us-rescinds-syrias-state-sponsor-of-terrorism-designation-and-delists-hayat-tahrir-al-sham/", "title": "US Rescinds Syria's SST Designation and Delists HTS (Baker McKenzie Sanctions News, Aug 2026)"}]}, {"topic": "restricted", "claim_ar": "ألغت وزارة الخارجية الأمريكية تصنيف سوريا دولةً راعية للإرهاب اعتباراً من 24 أغسطس 2026 (الإشعار العام 13114).", "claim_en": "The US State Department rescinded Syria's State Sponsor of Terrorism designation effective 24 August 2026 (Public Notice 13114).", "sources": [{"url": "https://public-inspection.federalregister.gov/2026-17653.pdf", "title": "Public Notice 13114: Rescission of Syria SST determination (Federal Register, 2026-17653)"}, {"url": "https://www.steptoe.com/en/news-publications/international-compliance-blog/us-rescinds-syrias-state-sponsor-of-terrorism-designation.html", "title": "US Rescinds Syria's State Sponsor of Terrorism Designation (Steptoe, Aug 2026)"}, {"url": "https://sanctionsnews.bakermckenzie.com/us-rescinds-syrias-state-sponsor-of-terrorism-designation-and-delists-hayat-tahrir-al-sham/", "title": "US Rescinds Syria's SST Designation and Delists HTS (Baker McKenzie Sanctions News, Aug 2026)"}]}, {"topic": "restricted", "claim_ar": "رفع الاتحاد الأوروبي العقوبات الاقتصادية على سوريا في 28 مايو 2025، مع إبقاء التدابير الأمنية. وفي مايو 2026 مدّد الاتحاد العقوبات على أفراد وكيانات مرتبطة بالنظام السابق (تجميد أموال وحظر سفر) حتى 1 يونيو 2027.", "claim_en": "The EU lifted economic sanctions on Syria on 28 May 2025, keeping security-related measures. In May 2026 it extended the listings of persons and entities linked to the former regime (asset freezes, travel bans) until 1 June 2027.", "sources": [{"url": "https://www.harneys.com/our-blogs/regulatory/eu-lifts-economic-sanctions-on-syria-maintains-measures-for-security-and-accountability/", "title": "EU lifts economic sanctions on Syria (Harneys, June 2025)"}, {"url": "https://www.thestar.com.my/news/world/2026/05/19/eu-extends-sanctions-on-former-assad-regime-for-one-year-delists-syrian-ministries", "title": "EU extends sanctions on former Assad regime for one year (Reuters via The Star, 19 May 2026)"}]}, {"topic": "restricted", "claim_ar": "رغم رفع العقوبات الشاملة، ما زال أفراد وكيانات على قوائم العقوبات الأمريكية والأوروبية. وحتى نوفمبر 2026 ما زالت سوريا ضمن مجموعة الدول E:1 لدى وزارة التجارة الأمريكية (BIS)، أي تبقى ضوابط مكافحة الإرهاب وضوابط المستخدم النهائي. افحص المشتري والبنك وشركة الشحن مقابل قوائم العقوبات قبل كل صفقة.", "claim_en": "Although comprehensive sanctions are gone, some persons and entities remain on US and EU sanctions lists. As of Nov 2026 Syria is still in BIS Country Group E:1, so anti-terrorism and end-use/end-user controls remain. Screen the buyer, bank and carrier before each deal.", "sources": [{"url": "https://www.steptoe.com/en/news-publications/international-compliance-blog/us-rescinds-syrias-state-sponsor-of-terrorism-designation.html", "title": "US Rescinds Syria's State Sponsor of Terrorism Designation (Steptoe, Aug 2026)"}, {"url": "https://sanctionsnews.bakermckenzie.com/us-rescinds-syrias-state-sponsor-of-terrorism-designation-and-delists-hayat-tahrir-al-sham/", "title": "US Rescinds Syria's SST Designation and Delists HTS (Baker McKenzie Sanctions News, Aug 2026)"}, {"url": "https://www.wttlonline.com/stories/us-eases-syria-defense-trade-restrictions-bis-country-group-change-remains-pending,15748", "title": "U.S. Eases Syria Defense Trade Restrictions; BIS Country-Group Change Pending (WTTL, 30 Sept 2026)"}, {"url": "https://www.afslaw.com/perspectives/national-security-counsel/syria-removed-itar-1261-arms-embargoed-countries-when-will", "title": "Syria Removed From ITAR 126.1 (ArentFox Schiff, 5 Oct 2026)"}]}, {"topic": "duty", "claim_ar": "صدر المرسوم 110 لسنة 2026 (18 مايو 2026) باعتماد تعرفة جمركية متناسقة مبنية على النظام المنسق (HS)، ونافذة من 1 يونيو 2026، وتلغي المرسومين 2651 لعام 2001 و377 لعام 2014.", "claim_en": "Decree 110/2026 (18 May 2026) adopted a harmonised HS-based customs tariff, effective 1 June 2026, repealing Decrees 2651/2001 and 377/2014.", "sources": [{"url": "https://sana.sy/presidency/2479092/", "title": "Decree 110 of 2026 on the harmonised customs tariff (SANA, 18 May 2026)"}, {"url": "https://www.gtai.de/de/trade/syrien/zoll/syrien-zollgesetz-zolltarif-2002266", "title": "Syrien: neues Zollgesetz und Zolltarif (GTAI, 12 June 2026)"}]}, {"topic": "duty", "claim_ar": "صدر قانون جمارك جديد بالمرسوم 109 لسنة 2026 (مايو 2026) يحل محل قانوني الجمارك رقم 37 و38 لعام 2006.", "claim_en": "A new Customs Law was issued by Decree 109/2026 (May 2026), replacing Customs Laws 37 and 38 of 2006.", "sources": [{"url": "https://sana.sy/presidency/2478774/", "title": "Decree 109 of 2026 issuing the new Customs Law (SANA, 18 May 2026)"}, {"url": "https://www.gtai.de/de/trade/syrien/zoll/syrien-zollgesetz-zolltarif-2002266", "title": "Syrien: neues Zollgesetz und Zolltarif (GTAI, 12 June 2026)"}, {"url": "https://asharq.com/politics/183568/الشرع-يصدر-قانونا-جديدا-للجمارك-يشمل-حظر-البضائع-الإسرائيلية/", "title": "Asharq: new customs law includes ban on Israeli goods (19 May 2026)"}]}, {"topic": "documents", "claim_ar": "المستندات الأساسية للتخليص في سوريا: فاتورة تجارية، شهادة منشأ، بوليصة شحن (بحري أو جوي)، وقائمة تعبئة. بعض السلع تحتاج موافقة من الجهات المختصة.", "claim_en": "Core clearance documents for Syria: commercial invoice, certificate of origin, bill of lading or air waybill, and packing list. Some goods need approval from the competent authorities.", "sources": [{"url": "https://english.enabbaladi.net/archives/2025/07/import-without-complications-in-syria-ambiguity-remains-an-obstacle/", "title": "Import Without Complications in Syria (Enab Baladi, July 2025)"}, {"url": "https://www.alsharqi.co/services/door-to-door/imea/syria/imports/", "title": "Syria imports (Alsharqi Shipping)"}]}, {"topic": "restricted", "claim_ar": "قانون الجمارك السوري الجديد (المرسوم 109 لسنة 2026) يمنع إدخال البضائع المخالفة لأحكام مقاطعة إسرائيل.", "claim_en": "Syria's new Customs Law (Decree 109/2026) bans goods that violate the Israel boycott provisions.", "sources": [{"url": "https://asharq.com/politics/183568/الشرع-يصدر-قانونا-جديدا-للجمارك-يشمل-حظر-البضائع-الإسرائيلية/", "title": "Asharq: new customs law includes ban on Israeli goods (19 May 2026)"}, {"url": "https://aawsat.com/node/5275034", "title": "Asharq Al-Awsat: decree tightens on smuggling and Israeli goods (May 2026)"}]}]}, {"code": "lb", "name_ar": "لبنان", "name_en": "Lebanon", "facts": [{"topic": "duty", "claim_ar": "الرسوم الجمركية في لبنان تُحسب حسب جدول التعرفة الرسمي (نسبة مئوية أو مبلغ ثابت للوحدة). جدول 2026 ملحق بالقانون 38 تاريخ 5/1/2026. الرسوم الإضافية (مثل 10% و3%) تغيرت عدة مرات، فاسأل المخلص الجمركي عن الوضع الحالي.", "claim_en": "Lebanese duties follow the official customs tariff (percentage or fixed amount per unit); the 2026 schedule is annexed to Law 38 of 5 Jan 2026. Extra fees (e.g. 10%, 3%) have changed several times; confirm current status with a customs broker.", "sources": [{"url": "https://taxsummaries.pwc.com/lebanon/corporate/other-taxes", "title": "Lebanon - Corporate - Other taxes (PwC, reviewed 1 Jul 2026)"}, {"url": "https://www.almodon.com/economy/2026/09/21/%D8%AC%D8%A7%D8%A8%D8%B1-%D9%8A%D8%AE%D9%81%D8%B6-%D8%A7%D9%84%D8%B1%D8%B3%D9%88%D9%85-%D8%B9%D9%84%D9%89-%D9%85%D8%AF%D8%AE%D9%84%D8%A7%D8%AA-%D8%A7%D9%84%D8%A5%D9%86%D8%AA%D8%A7%D8%AC", "title": "جابر يخفّض الرسوم على مدخلات الإنتاج (المدن، 21 سبتمبر 2026)"}]}, {"topic": "duty", "claim_ar": "منذ ديسمبر 2023 تُحسب القيمة الجمركية على سعر 89,500 ليرة للدولار.", "claim_en": "Since December 2023 customs valuation uses 89,500 LBP per USD.", "sources": [{"url": "https://blog.blominvestbank.com/wp-content/uploads/2025/07/Lebanese-Customs-Revenue-Some-Welcome-but-Surprising-Results-1.pdf", "title": "Lebanese Customs Revenue (BLOMINVEST, Jul 2025)"}, {"url": "https://economics.creditlibanais.com/Article/212533", "title": "Credit Libanais Economic Research (Feb 2025)"}]}, {"topic": "vat", "claim_ar": "ضريبة القيمة المضافة في لبنان 11%.", "claim_en": "Lebanon standard VAT rate is 11%.", "sources": [{"url": "https://taxsummaries.pwc.com/lebanon/corporate/other-taxes", "title": "Lebanon - Corporate - Other taxes (PwC, reviewed 1 Jul 2026)"}, {"url": "https://www.lloydsbanktrade.com/en/market-potential/lebanon/taxes", "title": "Lebanon: Tax rates (Lloyds Bank Trade, Nov 2026)"}]}, {"topic": "documents", "claim_ar": "مستندات الاستيراد: بيان جمركي موحد (SAD)، بوليصة شحن، قائمة تعبئة، فاتورة تجارية أصلية، إذن تسليم، براءة ذمة من الضمان الاجتماعي (للمؤسسات التجارية)، عقد البيع، وشهادة منشأ إذا لم يُذكر المنشأ في الفاتورة. وحسب المنتج: إجازة استيراد أو شهادة مطابقة.", "claim_en": "Import documents: SAD declaration, bill of lading, packing list, original commercial invoice, delivery order, Social Security quietus (commercial establishments), sales contract, certificate of origin if origin not on invoice; product-specific import licences or conformity certificates.", "sources": [{"url": "https://www.trade.gov/country-commercial-guides/lebanon-import-requirements-and-documentation", "title": "Lebanon - Import Requirements and Documentation (trade.gov, Feb 2026)"}, {"url": "https://www.lloydsbanktrade.com/en/market-potential/lebanon/customs", "title": "Lebanon: Customs (Lloyds Bank Trade, Nov 2026)"}]}, {"topic": "conformity", "claim_ar": "المواصفات اللبنانية (ليبنور) اختيارية في الأصل، وتصبح إلزامية بمرسوم من مجلس الوزراء لأسباب الصحة أو السلامة.", "claim_en": "Lebanese (LIBNOR) standards are voluntary in principle and become mandatory by Council of Ministers decree for health, safety or national-interest reasons.", "sources": [{"url": "https://www.trade.gov/country-commercial-guides/lebanon-standards-trade", "title": "Lebanon - Standards for Trade (trade.gov, Feb 2026)"}, {"url": "https://libnor.gov.lb/CustomPage.aspx?id=20", "title": "LIBNOR - Who we are"}]}, {"topic": "labelling", "claim_ar": "يمكن أن تكون البطاقة بالعربية أو الإنجليزية أو الفرنسية، ويجب أن تبين بلد المنشأ. البطاقات بالعبرية غير مقبولة.", "claim_en": "Labels may be in Arabic, English or French and must show country of origin; Hebrew labels are not accepted.", "sources": [{"url": "https://www.trade.gov/country-commercial-guides/lebanon-labelingmarking-requirements", "title": "Lebanon - Labeling/Marking Requirements (trade.gov, Feb 2026)"}, {"url": "https://goodhopefreight.com/customs-regulations/lebanon-customs-import-and-export-policy.html", "title": "Lebanon customs import and export policy (Goodhope Freight)"}]}, {"topic": "restricted", "claim_ar": "من الممنوعات: الولاعات العاملة بالغاز، البضائع الإسرائيلية المنشأ، الأجهزة الطبية والإشعاعية المستعملة، والملح غير المعالج باليود.", "claim_en": "Prohibited include gas-fuelled lighters, goods made in/originating from Israel, used medical and radiological apparatus, non-iodised table salt.", "sources": [{"url": "https://www.trade.gov/knowledge-product/lebanon-prohibited-restricted-imports", "title": "Lebanon - Prohibited and Restricted Imports (trade.gov, Feb 2026)"}, {"url": "https://goodhopefreight.com/customs-regulations/lebanon-customs-import-and-export-policy.html", "title": "Lebanon customs import and export policy (Goodhope Freight)"}]}, {"topic": "duty", "claim_ar": "قانون موازنة 2026 (القانون 40 تاريخ 10 فبراير 2026) يسمح للجمارك بتحصيل دفعة مسبقة 1.5% من قيمة الاستيراد من المكلفين الذين لم يقدموا تصاريح ضريبة الدخل أو القيمة المضافة عن أي من السنوات الثلاث السابقة. صدر قرار تطبيقي (801/1) في سبتمبر 2026. المبلغ يُحتسب من الضرائب المستحقة.", "claim_en": "The 2026 Budget Law (Law 40 of 10 Feb 2026) lets customs collect a 1.5% advance on import value from taxpayers who did not file income-tax or VAT returns for any of the three preceding years; implementing Decision 801/1 was issued Sep 2026. The amount is credited against taxes owed.", "sources": [{"url": "https://taxsummaries.pwc.com/lebanon/corporate/other-taxes", "title": "Lebanon - Corporate - Other taxes (PwC, reviewed 1 Jul 2026)"}, {"url": "https://regfollower.com/lebanon-sets-import-tax-payment-rules/", "title": "Lebanon sets import tax payment rules (RegFollower, 29 Sep 2026)"}]}]}, {"code": "iq", "name_ar": "العراق", "name_en": "Iraq", "facts": [{"topic": "importer", "claim_ar": "برنامج شهادة التسجيل (CoR) للمصنعين والموردين، من الشركة العامة للمعارض والخدمات التجارية العراقية (وزارة التجارة)، وتصدرها TÜV Rheinland. هي شرط للحصول على إجازة الاستيراد للفئات المنظمة، ومنها الأجهزة الكهربائية المنزلية.", "claim_en": "Certificate of Registration (CoR) for manufacturers/suppliers, from Iraq's State Company for Fairs and Commercial Services (Ministry of Trade), issued by TÜV Rheinland; a prerequisite for an import licence for regulated categories, including household electrical appliances.", "sources": [{"url": "https://www.tuv.com/landingpage/es/government-inspections-international-trade/navigation/pvoc/exporting-to-the-middle-east/iraq-icigi/", "title": "Iraq ICIGI / CoR (TÜV Rheinland)"}, {"url": "https://www.ihk.de/rostock/international/laender-maerkte/irak-einfuehrung-eines-certificate-of-registration--4989794", "title": "Irak: Einführung eines Certificate of Registration (IHK Rostock)"}]}, {"topic": "duty", "claim_ar": "منذ مطلع 2026 يطبق العراق تعرفة جديدة بقرار مجلس الوزراء 957 لسنة 2025، بنسب تصل إلى 30%. في فبراير 2026 ردّت المحكمة الاتحادية العليا دعوى ضد القرار (لعدم وجود مصلحة للمدعي)، فبقي القرار نافذاً. تأكد من النسبة حسب رمز السلعة.", "claim_en": "Since early 2026 Iraq applies a new tariff under Cabinet Decision 957/2025, with rates up to 30%. In Feb 2026 the Federal Supreme Court dismissed a challenge (no standing), so the decision stays in force. Check the rate per HS code.", "sources": [{"url": "https://shafaq.com/en/Report/Explainer-Iraq-s-updated-customs-tariffs-legal-dispute-and-market-impact", "title": "Explainer: Iraq's updated customs tariffs (Shafaq News, Feb 2026)"}, {"url": "https://www.kurdistan24.net/en/story/893363", "title": "Iraq's Federal Court Upholds Customs Tariff Hike (Kurdistan24, 11 Feb 2026)"}, {"url": "https://peregraf.com/en/news/10887", "title": "Iraq's Top Court Dismisses Challenge to New Customs Tariff (Peregraf, 11 Feb 2026)"}]}, {"topic": "duty", "claim_ar": "توحيد التعرفة ونظام أسيكودا في منافذ إقليم كردستان ما زال قيد التنفيذ في 2026، وقد تختلف الإجراءات في منافذ الإقليم عن باقي العراق.", "claim_en": "Unifying the tariff and ASYCUDA at Kurdistan Region crossings was still in progress in 2026; procedures at KRG crossings may differ from the rest of Iraq.", "sources": [{"url": "https://peregraf.com/en/news/10903", "title": "Iraq and Kurdistan Region Move Toward Unified Customs Tariffs (Peregraf, 12 Feb 2026)"}, {"url": "https://channel8.com/english/news/64967", "title": "Baghdad Demands Rapid ASYCUDA Customs Rollout In Kurdistan (Channel8, 3 Sep 2026)"}, {"url": "https://rudaw.net/english/categories/economic/1079143", "title": "Iraq customs revenue (Rudaw, Sep 2026)"}]}, {"topic": "vat", "claim_ar": "لا توجد ضريبة قيمة مضافة عامة في العراق؛ توجد ضريبة مبيعات على سلع وخدمات محددة (مثل السيارات 15%، التبغ والكحول 300%).", "claim_en": "No general VAT in Iraq; a sales tax applies to specific items (e.g. cars 15%, alcohol/tobacco 300%).", "sources": [{"url": "https://taxsummaries.pwc.com/iraq/corporate/other-taxes", "title": "Iraq - Corporate - Other taxes (PwC, reviewed 24 Jun 2026)"}, {"url": "https://www.lloydsbanktrade.com/en/market-potential/iraq/taxes", "title": "Iraq: Tax rates (Lloyds Bank Trade, Nov 2026)"}]}, {"topic": "conformity", "claim_ar": "برنامج COSQC: كل شحنة فيها منتجات منظمة تحتاج شهادة مطابقة (CoC) قبل الشحن من جهة معتمدة (مثل Intertek وBureau Veritas وTÜV). المنتجات المنظمة تشمل: الألعاب، الأجهزة الكهربائية والإلكترونية، أدوات المطبخ، الأدوات المنزلية، المنسوجات، مستحضرات التجميل، قطع غيار المركبات والإطارات، مواد البناء، المواد الغذائية. بدون الشهادة: تأخير أو غرامات أو إرجاع الشحنة.", "claim_en": "COSQC programme: consignments with regulated products need a pre-shipment Certificate of Conformity from an appointed body (e.g. Intertek, Bureau Veritas, TÜV). Regulated products include toys, electrical/electronic goods, kitchenware, household hardware, textiles, cosmetics, vehicle parts and tyres, construction products, food. Without it: delays, penalties or returned shipments.", "sources": [{"url": "https://www.intertek.com.hk/government/conformity-assessment/coc-iraq/", "title": "Certificates of Conformity Programme for Iraq (Intertek)"}, {"url": "https://cdn2-verigates.bureauveritas.com/sites/verigates/files/2024-05/IRAQ%20%28VOC%29%20Rev%206.7.pdf", "title": "IRAQ (VOC) Datasheet Rev 6.7 (Bureau Veritas, May 2024)"}, {"url": "https://www.tuv.com/press/en/press-releases/key-regulatory-update-under-iraq-icigi.html", "title": "Key regulatory update under Iraq ICIGI (TÜV Rheinland, Jun 2025)"}]}, {"topic": "conformity", "claim_ar": "تحدّث COSQC قائمة المنتجات المنظمة والمواصفات بين حين وآخر (آخرها تحديثات 2025)، فتأكد من القائمة الحالية قبل الشحن.", "claim_en": "COSQC updates the regulated product list and standards from time to time (latest updates in 2025); check the current list before shipping.", "sources": [{"url": "https://www.chamber-international.com/news/latest-news/iraq-conformity-assessment-programme-essential-updates-for-exporters/", "title": "Iraq Conformity Assessment Programme updates (Chamber International, Jan 2025)"}, {"url": "https://www.tuv.com/press/en/press-releases/key-regulatory-update-under-iraq-icigi.html", "title": "Key regulatory update under Iraq ICIGI (TÜV Rheinland, Jun 2025)"}]}, {"topic": "labelling", "claim_ar": "المنتجات المنظمة يجب أن تحمل بيانات بالعربية (اسم المنتج، التحذيرات، تعليمات الاستعمال، المكونات عند اللزوم) وبلد المنشأ. اختصار PRC مقبول للصين، وEU غير مقبول كبلد منشأ.", "claim_en": "Regulated products need Arabic labelling (product name, warnings, instructions, ingredients where required) and country of origin. PRC is accepted for China; EU is not accepted as origin.", "sources": [{"url": "https://cdn2-verigates.bureauveritas.com/sites/verigates/files/2024-05/IRAQ%20%28VOC%29%20Rev%206.7.pdf", "title": "IRAQ (VOC) Datasheet Rev 6.7 (Bureau Veritas, May 2024)"}, {"url": "https://tr.tuv.at/fileadmin/user_upload/TR/ueruen-belgelendirme/INS-VOC-007_Datasheet_for_Trade_-_IRAQ_Rev.01_31.10.2023-watermarked.pdf", "title": "Datasheet for Trade - Iraq (TÜV Austria, Oct 2023)"}]}, {"topic": "documents", "claim_ar": "من 10 يوليو 2026: التحقق الإلكتروني إلزامي من شهادات المنشأ والفواتير التجارية عبر نظام أسيكودا، وقد يُوقف البيان الجمركي إذا لم تُتحقق المستندات.", "claim_en": "From 10 July 2026, electronic verification of certificates of origin and commercial invoices via ASYCUDA is mandatory; declarations may be suspended if documents are not verified.", "sources": [{"url": "https://www.deloitte.com/middle-east/en/services/tax/perspectives/iraq-customs-activates-electronic-verification-of-import.html", "title": "Iraq Customs activates electronic verification (Deloitte, 14 Jul 2026)"}, {"url": "https://www.steelradar.com/en/iraq-introduces-electronic-verification-for-customs-procedures/", "title": "Iraq introduces electronic verification for customs procedures (SteelRadar)"}]}]}, {"code": "jo", "name_ar": "الأردن", "name_en": "Jordan", "facts": [{"topic": "importer", "claim_ar": "الشركات التجارية تحتاج بطاقة مستورد من وزارة الصناعة والتجارة والتموين، أو تدفع كفالة/رسماً جمركياً بنسبة 5% من قيمة البضاعة.", "claim_en": "Trading companies need an importer's card from the Ministry of Industry, Trade and Supply, or pay a customs bond/fee of 5% of goods value.", "sources": [{"url": "https://www.trade.gov/country-commercial-guides/jordan-import-requirements-and-documentation", "title": "Jordan - Import Requirements and Documentation (trade.gov, Feb 2026)"}, {"url": "https://www.lloydsbanktrade.com/en/market-potential/jordan/customs", "title": "Jordan: Customs (Lloyds Bank Trade, Nov 2026)"}]}, {"topic": "duty", "claim_ar": "تختلف الرسوم الجمركية حسب نوع السلعة وبلد المنشأ وفق التعرفة المبنية على النظام المنسق. في يناير 2022 خُفضت فئات الرسوم من 11 إلى 4 فئات (من 0% إلى 25%). تأكد من النسبة حسب رمز السلعة.", "claim_en": "Duty varies by product and origin per the HS-based tariff. In Jan 2022 the duty brackets were cut from 11 to 4 (0% to 25%). Check the rate per HS code.", "sources": [{"url": "https://taxsummaries.pwc.com/jordan/corporate/other-taxes", "title": "Jordan - Corporate - Other taxes (PwC, reviewed 5 Jul 2026)"}, {"url": "https://www.customs.gov.jo/en/CMS_NewsDetails.aspx?Key=12110", "title": "The New Tariff Structure Details (Jordan Customs, Jan 2022)"}, {"url": "https://www.jordannews.jo/Section-109/News/PM-announces-major-reform-of-customs-tariffs-11739", "title": "PM announces major reform of customs tariffs (Jordan News, Jan 2022)"}]}, {"topic": "vat", "claim_ar": "ضريبة المبيعات العامة في الأردن 16%، وتُطبق أيضاً على السلع المستوردة.", "claim_en": "Jordan general sales tax is 16%, also applied to imported goods.", "sources": [{"url": "https://taxsummaries.pwc.com/jordan/corporate/other-taxes", "title": "Jordan - Corporate - Other taxes (PwC, reviewed 5 Jul 2026)"}, {"url": "https://www.lloydsbanktrade.com/en/market-potential/jordan/taxes", "title": "Jordan: Tax rates (Lloyds Bank Trade, Nov 2026)"}]}, {"topic": "online", "claim_ar": "منذ 1 فبراير 2026 تُفرض ضريبة مبيعات 16% على الطرود البريدية الواردة التي لا تتجاوز قيمتها الجمركية 200 دينار، مع رسم جمركي صفر (قرار مجلس الوزراء نوفمبر 2025).", "claim_en": "Since 1 Feb 2026, a 16% sales tax applies to incoming postal parcels with customs value up to JOD 200, with zero customs duty (Cabinet decision, Nov 2025).", "sources": [{"url": "https://www.jordannews.jo/Section-112/Economy/16-Sales-Tax-on-Incoming-Postal-Parcels-Comes-into-Effect-48507", "title": "16% Sales Tax on Incoming Postal Parcels Comes into Effect (Jordan News, 1 Feb 2026)"}, {"url": "https://pt1.petra.gov.jo/en/news/garment-traders-union-hails-cabinet-decision-to-tax-online-import-shipments", "title": "Garment Traders' Union Hails Cabinet Decision (Petra, 17 Nov 2025)"}]}, {"topic": "documents", "claim_ar": "المستندات الأساسية: فاتورة تجارية، وبوليصة شحن (أو بوليصة شحن جوي)، وشهادة منشأ (غالباً تُطلب). البيان الجمركي يقدمه مخلص أردني معتمد.", "claim_en": "Core documents: commercial invoice, bill of lading (or air waybill), and certificate of origin (usually requested). The customs declaration is filed by an authorised Jordanian agent.", "sources": [{"url": "https://www.trade.gov/country-commercial-guides/jordan-import-requirements-and-documentation", "title": "Jordan - Import Requirements and Documentation (trade.gov, Feb 2026)"}, {"url": "https://www.lloydsbanktrade.com/en/market-potential/jordan/customs", "title": "Jordan: Customs (Lloyds Bank Trade, Nov 2026)"}]}, {"topic": "conformity", "claim_ar": "مؤسسة المواصفات والمقاييس الأردنية (JSMO) تفحص البضائع المستوردة في المراكز الجمركية، وقد تأخذ عينات للمختبر أو تدقق وثائق المطابقة قبل الإفراج.", "claim_en": "JSMO checks imported goods at customs centres and may take samples for lab testing or check conformity documents before release.", "sources": [{"url": "https://tradeportal.customs.gov.jo/procedure/1334/step/1309?l=en", "title": "Jordan Customs Trade Portal - JSMO approval procedure"}, {"url": "https://jordantimes.com/news/local/jsmo-handles-47801-customs-declarations-q1-2025", "title": "JSMO handles 47,801 customs declarations in Q1 2025 (Jordan Times)"}]}, {"topic": "labelling", "claim_ar": "بطاقة المنتجات الغذائية يجب أن تكون بالعربية. trade.gov يقول إن كل البطاقات يجب أن تكون بالعربية أو بملصق عربي، فالأفضل وضع ملصق عربي لكل المنتجات.", "claim_en": "Food labels must be in Arabic. trade.gov says all labels must be in Arabic or carry an Arabic sticker, so an Arabic sticker on all products is the safe choice.", "sources": [{"url": "https://trade.gov/country-commercial-guides/jordan-labelingmarking-requirements", "title": "Jordan - Labeling/Marking Requirements (trade.gov, Feb 2026)"}, {"url": "https://www.check-international-trade-barriers.service.gov.uk/barriers/9NQPZ9/?resolved=1", "title": "Arabic labelling for food exports to Jordan (UK Gov trade barriers, updated 2022)"}]}, {"topic": "restricted", "claim_ar": "من الممنوعات: النفايات البلاستيكية. قواعد استيراد السيارات تغيرت في نوفمبر 2025، فتأكد منها قبل الشحن.", "claim_en": "Prohibited: plastic waste. Vehicle import rules changed in Nov 2025; check before shipping.", "sources": [{"url": "https://trade.gov/country-commercial-guides/jordan-prohibited-restricted-imports", "title": "Jordan - Prohibited and Restricted Imports (trade.gov, Feb 2026)"}, {"url": "https://www.lloydsbanktrade.com/en/market-potential/jordan/customs", "title": "Jordan: Customs (Lloyds Bank Trade, Nov 2026)"}, {"url": "https://www.jordannews.jo/Section-112/Economy/Vehicle-Sector-Restructuring-Comes-into-Effect-Details-46181", "title": "Vehicle Sector Restructuring Comes into Effect (Jordan News, Nov 2025)"}]}]}];

function ctryPanel(c){
  const src=[]; const cite=f=>(f.sources||[]).map(s=>{ let i=src.findIndex(x=>x.url===s.url); if(i<0){src.push(s);i=src.length-1;} return `<sup><a href="#src-${c.code}-${i+1}">${i+1}</a></sup>`; }).join("");

function bindCalc(){
  /* Accepts Arabic-Indic (٠-٩) and Persian (۰-۹) digits and a comma decimal,
     because this is an Arabic-first site and those keypads are normal here.
     Negative values are never meaningful in a landed-cost model. */
  const normNum = v => String(v==null?"":v)
      .replace(/[\u0660-\u0669]/g,c=>c.charCodeAt(0)-0x0660)
      .replace(/[\u06F0-\u06F9]/g,c=>c.charCodeAt(0)-0x06F0)
      .replace(/[\u066B,]/g,".")
      .replace(/[\u066C\u2066-\u2069\s]/g,"");
  const g=k=>{
    const e=document.getElementById("c_"+k); if(!e) return 0;
    const n=parseFloat(normNum(e.value));
    return Number.isFinite(n) && n>0 ? n : 0;
  };
  const el=i=>document.getElementById(i);
  const calc=()=>{
    const unit=g("unit"),qty=g("qty"),frtot=g("frtot"),dutyP=g("duty"),vatP=g("vat"),
          comp=g("comp"),fee=g("fee"),other=g("other"),sell=g("sell");
    const ck=document.getElementById("c_ctry").value, C=CTRY()[ck]||{};
    const goods=unit*qty;
    const cif=goods+frtot;
    const duty=cif*dutyP/100;
    const vat=(cif+duty)*vatP/100;
    let gov=0;
    if(C.gov && cif>0){ const inLocal=cif*C.gov.rate*C.gov.pct;
      gov=Math.min(Math.max(inLocal,C.gov.min),C.gov.max)/C.gov.rate; }
    const svc=fee+other+comp+gov;
    const total=goods+frtot+duty+vat+svc;
    const per= qty>0 ? total/qty : 0;
    const rev=sell*qty, profit=rev-total;
    const margin= sell>0 ? (sell-per)/sell*100 : 0;
    const be= sell>0 ? Math.ceil(total/sell) : 0;

    /* A quantity is required before any per-unit or margin figure means
       anything. Without it, per-unit cost is 0 and margin reads a flattering
       100% — the opposite of the truth on an unfinished form. */
    const ready = qty>0 && unit>0;
    el("o_unit").textContent = ready ? "$"+money(per) : "—";
    el("o_unitsub").textContent = ready
      ? L(`مقابل ${money(unit)} $ سعر المصنع — الزيادة ${Math.round((per/unit-1)*100)}%`,
          `vs $${money(unit)} ex-factory — a ${Math.round((per/unit-1)*100)}% uplift`)
      : L("أدخل سعر الوحدة والكمية أولًا.","Enter the unit price and quantity first.");
    el("o_total").textContent  = ready ? "$"+money(total) : "—";
    el("o_margin").textContent = (ready && sell>0) ? clampPct(margin) : "—";
    el("o_profit").textContent = ready ? "$"+money(profit) : "—";
    el("o_be").textContent     = (ready && sell>0 && total>0)
      ? be.toLocaleString("en-US")+" "+L("وحدة","units") : "—";
    el("o_margin").className   = margin<0 ? "neg" : (margin<20 ? "warn" : "");
    el("o_profit").className   = profit<0 ? "neg" : "";

    const vals={goods,freight:frtot,duty,vat,fee:svc};
    const dark=document.documentElement.getAttribute("data-theme")==="dark";
    let bar="",leg="",tab="";
    CC().forEach(([k,label,cl,cd])=>{
      const v=vals[k], pct= total>0 ? v/total*100 : 0, c= dark?cd:cl;
      if(pct>0.05) bar+=`<span class="seg" style="width:${pct}%;background:${c}" title="${label}: $${money(v)} (${pct.toFixed(1)}%)">${pct>=4?`<i>${pct.toFixed(0)}%</i>`:""}</span>`;
      leg+=`<span class="lg"><i style="background:${c}"></i>${label}</span>`;
      tab+=`<tr><td><i class="sw" style="background:${c}"></i>${label}</td><td>$${money(v)}</td><td>${pct.toFixed(1)}%</td></tr>`;
    });
    el("o_bar").innerHTML=bar; el("o_leg").innerHTML=leg;
    el("o_tab").innerHTML=tab+`<tr class="total"><td>${L("الإجمالي","Total")}</td><td>$${money(total)}</td><td>100%</td></tr>`;
    const sub=[[L("رسوم الخدمة","Service fee"),fee],[L("رسوم المطابقة والشهادات","Conformity & certificates"),comp],
               [L("رسوم الخدمة الجمركية","Customs service fee"),gov],[L("تكاليف أخرى","Other costs"),other]]
      .filter(x=>x[1]>0);
    el("o_sub").innerHTML = sub.length
      ? L("داخل بند الخدمة والامتثال: ","Inside the service & conformity line: ")+
        sub.map(x=>`${x[0]} $${money(x[1])}`).join(" · ")
      : "";

    const msg=L(`حسبة تقديرية من الموقع:\nبلد الوصول: ${C.n||"—"}\nالكمية: ${qty}\nسعر المصنع: ${money(unit)} $\nتكلفة الوحدة النهائية: ${money(per)} $\nرأس المال: ${money(total)} $\nهامش الربح الإجمالي: ${margin.toFixed(1)}%`,
                `Estimate from the site:\nDestination: ${C.n||"—"}\nQty: ${qty}\nEx-factory: $${money(unit)}\nLanded unit cost: $${money(per)}\nCapital: $${money(total)}\nMargin: ${margin.toFixed(1)}%`);
    el("o_send").href = waLink(msg);
    el("o_send").target="_blank"; el("o_send").rel="noopener";
  };
  const sel=document.getElementById("c_ctry");
  const setC=(apply)=>{
    const C=CTRY()[sel.value]||{};
    const note=document.getElementById("c_cnote");
    note.innerHTML = `<b>${C.body||""}</b>${C.note?" — "+C.note:""}`+
      ``;
    if(apply){
      /* Where a country has no published headline rate (Yemen, "another
         country"), blank the field and ask for a figure. Leaving the previous
         country's numbers in place shows the user someone else's rates as
         though they were their own. */
      [["duty",C.duty],["vat",C.vat],["comp",C.comp]].forEach(([k,v])=>{
        const e=document.getElementById("c_"+k); if(!e) return;
        if(v!=null){ e.value=v; e.removeAttribute("placeholder"); }
        else { e.value=""; e.setAttribute("placeholder",L("أدخل نسبتك","Enter your own rate")); }
      });
    }
    calc();
  };
  sel.addEventListener("change",()=>setC(true));
  document.querySelectorAll(".calc-in input").forEach(i=>i.addEventListener("input",calc));
  const pb=document.getElementById("o_print");
  if(pb) pb.addEventListener("click",()=>window.print());
  setC(false);
}

function bindFaq(){
  const inp=$("#fq"), acc=$("#facc"), empty=$("#fqe"), num=$("#fqn");
  if(!inp) return;
  const items=[...acc.querySelectorAll("details")];
  const norm=t=>t.toLowerCase().replace(/[\u064B-\u065F\u0670]/g,"").replace(/[أإآ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه");
  const run=()=>{
    const q=norm(inp.value.trim());
    let shown=0;
    items.forEach(d=>{
      const hit = !q || norm(d.textContent).includes(q);
      d.style.display = hit ? "" : "none";
      if(hit) shown++;
      if(q && hit) d.open = true; else if(!q) d.open = false;
    });
    empty.style.display = shown ? "none" : "block";
    acc.style.display   = shown ? "" : "none";
    num.textContent = q ? L(`${shown} نتيجة`,`${shown} result${shown===1?"":"s"}`) : "";
  };
  inp.addEventListener("input",run);
}

const QKEY="rsbl_qf";
function bindQualify(){
  const steps=[...document.querySelectorAll(".fstep")], defs=Q_STEPS();
  let i=0;
  const bar=$("#bar"),st=$("#stitle"),sc=$("#scount"),prev=$("#prev"),next=$("#next"),send=$("#send"),form=$("#qform");
  const draw=()=>{
    steps.forEach((s,x)=>s.classList.toggle("on",x===i));
    bar.style.width=((i+1)/steps.length*100)+"%";
    st.textContent=defs[i].t; sc.textContent=L(`الخطوة ${i+1} من ${steps.length}`,`Step ${i+1} of ${steps.length}`);
    prev.style.display=i?"block":"none"; next.style.display=i<steps.length-1?"block":"none";
    send.style.display=i===steps.length-1?"block":"none";
    window.scrollTo({top:$("#qf").offsetTop-90,behavior:"smooth"});
  };
  const valid=()=>{
    let ok=true, first=null;
    defs[i].f.filter(f=>f.req).forEach(f=>{
      const els=form.querySelectorAll(`[name="${f.k}"]`);
      let has=false, bad=false;
      els.forEach(e=>{
        if(e.type==="radio"||e.type==="checkbox"){ if(e.checked) has=true; }
        else if(e.value.trim()){ has=true; if(!e.checkValidity()) bad=true; }
      });
      const err=form.querySelector(`.err[data-for="${f.k}"]`);
      if(err){
        err.textContent = bad
          ? L("تحقّق من صيغة ما كتبته.","Please check the format of what you entered.")
          : L("هذا الحقل مطلوب.","This field is required.");
        err.classList.toggle("on", !has || bad);
      }
      els.forEach(e=>e.setAttribute("aria-invalid", (!has||bad) ? "true" : "false"));
      if((!has||bad) && !first) first = els[0];
      if(!has||bad) ok=false;
    });
    if(first) first.focus();
    return ok;
  };
  /* Keep what the visitor typed across a language or theme switch, and across
     an accidental navigation. Cleared once the request is actually received. */
  const saveState=()=>{
    try{
      const o={}; new FormData(form).forEach((v,k)=>{ o[k]=o[k]?o[k]+"|"+v:v; });
      store.s(QKEY, JSON.stringify({step:i,data:o}));
    }catch(e){}
  };
  const restoreState=()=>{
    try{
      const raw=store.g(QKEY); if(!raw) return;
      const {step,data}=JSON.parse(raw); if(!data) return;
      Object.entries(data).forEach(([k,v])=>{
        const vals=String(v).split("|");
        form.querySelectorAll(`[name="${k}"]`).forEach(e=>{
          if(e.type==="radio"||e.type==="checkbox") e.checked=vals.includes(e.value);
          else e.value=vals[0];
        });
      });
      if(Number.isInteger(step) && step>=0 && step<steps.length) i=step;
    }catch(e){}
  };
  restoreState();
  form.addEventListener("input",saveState);
  form.addEventListener("change",saveState);
  form.addEventListener("change",e=>{
    const o=e.target.closest(".opt"); if(!o) return;
    if(e.target.type==="radio") o.parentElement.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));
    o.classList.toggle("sel",e.target.checked);
  });
  next.addEventListener("click",()=>{ if(valid()){ i++; draw(); }});
  prev.addEventListener("click",()=>{ i--; draw(); });
  form.addEventListener("submit",async e=>{
    e.preventDefault(); if(!valid()) return;
    const fd=new FormData(form), data={};
    for(const [k,v] of fd.entries()){ data[k]=data[k]?data[k]+" | "+v:v; }
    data.lang=LANG; data.page=location.href; data.submittedAt=new Date().toISOString();
    const reset=()=>{ send.disabled=false; send.textContent=L("إرسال الطلب","Submit request"); };
    const fail=(m)=>{ reset(); const b=$("#q_err"); if(b){ b.textContent=m; b.hidden=false; b.focus(); } else alert(m); };
    send.disabled=true; send.textContent=L("جارٍ الإرسال…","Sending…");
    const eb=$("#q_err"); if(eb) eb.hidden=true;

    /* A submission counts as received only when the endpoint confirms it.
       Never navigate to the thank-you page on an unverified hand-off. */
    if(CFG.formEndpoint){
      try{
        const r=await fetch(CFG.formEndpoint,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});
        if(!r.ok) throw new Error("HTTP "+r.status);
        try{ store.s(QKEY,""); }catch(e){}
        go("/thanks");
      }catch(err){
        fail(L("تعذّر إرسال الطلب. تحقّق من اتصالك وأعد المحاولة، أو راسلنا مباشرة وسنكمل معك.",
               "We could not send your request. Check your connection and try again, or message us directly and we will take it from there."));
      }
    }else{
      /* No endpoint configured yet: hand off to WhatsApp and say so honestly.
         We do NOT claim the request was received, because it was not. */
      const w=window.open(waLink(L("طلب تأهيل جديد:\n","New qualification request:\n")+Object.entries(data).map(([k,v])=>`${k}: ${v}`).join("\n")),"_blank");
      reset();
      const b=$("#q_err");
      if(b){
        b.className="notice"; b.hidden=false;
        b.innerHTML = w
          ? L("فتحنا لك واتساب ومعه إجاباتك جاهزة. <b>أرسل الرسالة لتصلنا</b> — لم يُسجَّل طلبك بعد.",
              "We have opened WhatsApp with your answers ready. <b>Send the message so it reaches us</b> — your request has not been recorded yet.")
          : L("منع المتصفح فتح واتساب. افتحه يدويًا وأرسل لنا إجاباتك، أو راسلنا على البريد.",
              "Your browser blocked WhatsApp from opening. Please open it manually and send us your answers, or email us instead.");
        b.focus();
      }
    }
  });
  draw();
}

function bindCompliance(){
  const J=CJUR(), C=CCAT();
  const out=document.getElementById("cq_out");
  const draw=()=>{
    const jk=document.getElementById("cq_j").value, ck=document.getElementById("cq_c").value;
    const j=J[jk], c=C[ck];
    const notes=(c.notes||[]).filter(n=>n[0]===jk).map(n=>n[1]);
    out.innerHTML=`<div class="card" style="max-width:820px;margin-inline:auto">
      <span class="eyebrow" style="margin-bottom:6px">${j.n} · ${c.n}</span>
      <h3 style="margin-top:0">${j.body}</h3>
      <ul style="margin:14px 0 0;padding-inline-start:20px;display:grid;gap:8px;font-size:.94rem">
        ${j.req.map(r=>`<li>${r}</li>`).join("")}
      </ul>
      <div class="info" style="margin-top:18px">${j.tax}</div>
      ${j.rf?`<p class="muted" style="font-size:.9rem;margin-top:12px">${j.rf}</p>`:""}
      ${notes.length?`<div class="notice" style="margin-top:14px"><strong>${L("تنبيه ساري:","Live alert:")}</strong> ${notes.join(" ")}</div>`:""}
    </div>`;
  };
  document.getElementById("cq_j").addEventListener("change",draw);
  document.getElementById("cq_c").addEventListener("change",draw);
  draw();
}
