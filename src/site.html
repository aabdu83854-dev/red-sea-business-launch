    <button type="button" class="ppadd ppnoprint">+ خانة صورة إضافية</button>
  </section>`).join("")}
  <footer class="ppfoot">
    <div><h4>عن هذا المستند</h4><p>يوثّق هذا الجواز مسار شحنتك من اعتماد الطلب حتى التسليم بالصور والمستندات. كل صورة التقطها فريقنا في الصين في التاريخ المذكور أمام مرحلتها.</p></div>
    <div class="ppsig"><b>المسؤول عن الشحنة · التوقيع والختم</b><div class="l"></div></div>
    <p class="pplegal">الصور والمستندات في هذا الجواز تخص هذه الشحنة وحدها. التواريخ التقديرية للإبحار والوصول تتغيّر بقرار خط الملاحة والميناء وسلطات التخليص. <span contenteditable="true" data-ph="ملاحظة إضافية…"></span></p>
  </footer></article>`;
}
function bindPassport(){
  const doc=document.getElementById("ppdoc");
  const trk=document.getElementById("pptrk");
  const sync=()=>document.querySelectorAll(".ppstg").forEach(st=>{
    const s=st.querySelector(".ppst").dataset.s;
    trk.children[+st.dataset.i].className = s==="done"?"d":(s==="na"?"":"w");
  });
  sync();
  doc.addEventListener("click",e=>{
    const x=e.target.closest(".x");
    if(x){ e.preventDefault(); e.stopPropagation();
      const l=x.closest(".ppslot"); l.classList.remove("has");
      l.querySelector("img").removeAttribute("src"); l.querySelector("input").value=""; return; }
    const b=e.target.closest(".ppst");
    if(b){ const n=PP_ORDER[(PP_ORDER.indexOf(b.dataset.s)+1)%PP_ORDER.length];
      b.dataset.s=n; b.textContent=PP_ST[n]; sync(); return; }
    const a=e.target.closest(".ppadd");
    if(a){ const g=a.previousElementSibling, d=document.createElement("div");
      d.innerHTML=ppSlot("صورة إضافية"); g.appendChild(d.firstElementChild); }
  });
  doc.addEventListener("change",e=>{
    const inp=e.target; if(!inp.matches(".ppslot input[type=file]")) return;
    const f=inp.files&&inp.files[0]; if(!f) return;
    if(f.type.indexOf("image/")!==0){ alert("الملف ليس صورة."); inp.value=""; return; }
    const lab=inp.closest(".ppslot"), fr=new FileReader();
    fr.onload=()=>{ const im=new Image();
      im.onload=()=>{ const w=im.naturalWidth,h=im.naturalHeight,k=Math.min(1,1400/Math.max(w,h));
        let src=fr.result;
        if(k<1){ const c=document.createElement("canvas");
          c.width=Math.round(w*k); c.height=Math.round(h*k);
          c.getContext("2d").drawImage(im,0,0,c.width,c.height);
          try{ src=c.toDataURL("image/jpeg",.8); }catch(_){}}
        lab.querySelector("img").src=src; lab.classList.add("has"); };
      im.onerror=()=>{ lab.querySelector("img").src=fr.result; lab.classList.add("has"); };
      im.src=fr.result; };
    fr.onerror=()=>alert("تعذّر قراءة الصورة.");
    fr.readAsDataURL(f);
  });
  doc.addEventListener("paste",e=>{
    if(!e.target.isContentEditable) return;
    e.preventDefault();
    document.execCommand("insertText",false,(e.clipboardData||window.clipboardData).getData("text/plain"));
  });
  doc.addEventListener("input",e=>{
    const t=e.target; if(t.isContentEditable && !t.textContent.trim()) t.innerHTML="";
  });
  document.getElementById("ppPdf").addEventListener("click",()=>window.print());
  document.getElementById("ppNew").addEventListener("click",()=>{ if(confirm("سيُمسح كل ما كتبته وكل الصور. متأكد؟")) render(); });
  document.getElementById("ppExp").addEventListener("click",ppExport);
}
function ppExport(){
  const src=document.getElementById("ppdoc");
  const refEl=src.querySelector(".ppmast .r span");
  const ref=(refEl&&refEl.textContent.trim())||"RSBL-0000";
  const cliEl=src.querySelector(".ppsum dd");
  const client=(cliEl&&cliEl.textContent.trim())||"";
  const c=src.cloneNode(true);
  c.removeAttribute("id");
  c.querySelectorAll(".ppadd,.pptip,.x,.ppslot input,.ppslot:not(.has)").forEach(n=>{
    const holder=n.classList.contains("ppslot")?n.parentNode:n; holder.remove(); });
  c.querySelectorAll("[contenteditable]").forEach(n=>{
    n.removeAttribute("contenteditable");
    if(!n.textContent.trim() && n.dataset.ph==="—") n.textContent="—";
    n.removeAttribute("data-ph");
  });
  c.querySelectorAll(".ppgrid").forEach(g=>{ if(!g.children.length) g.remove(); });
  c.querySelectorAll(".dt,.ppnote,.ppcap,.pplegal span").forEach(n=>{ if(!n.textContent.trim()) n.remove(); });
  const title="جواز الشحنة "+ref+(client?" — "+client:"");
  const FONTS='https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap';
  const ZJS='document.addEventListener("click",function(e){var z=document.getElementById("ppz");'+
    'if(e.target.closest(".ppz")){z.classList.remove("on");return;}'+
    'var i=e.target.closest(".ppdoc img");if(i&&i.src){z.querySelector("img").src=i.src;z.classList.add("on");}});'+
    'document.addEventListener("keydown",function(e){if(e.key==="Escape")document.getElementById("ppz").classList.remove("on");});';
  const html='<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">'+
    '<meta name="viewport" content="width=device-width,initial-scale=1">'+
    '<meta name="robots" content="noindex,nofollow">'+
    '<title>'+esc(title)+'</title>'+
    '<link rel="icon" href="/assets/favicon.png">'+
    '<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>'+
    '<link rel="stylesheet" href="'+FONTS+'">'+
    '<style>body{margin:0;padding:22px 14px 60px;background:#EEF2F6;'+
    'font-family:"IBM Plex Sans Arabic",system-ui,sans-serif}'+
    '@media print{body{padding:0;background:#fff}}'+PP_CSS+
    '.ppz{position:fixed;inset:0;z-index:99;background:rgba(11,37,69,.92);display:none;'+
    'place-items:center;padding:20px;cursor:zoom-out}.ppz img{max-width:100%;max-height:100%;'+
    'border-radius:6px}.ppz.on{display:grid}.ppdoc img{cursor:zoom-in}'+
    '@media print{.ppz{display:none!important}}</style></head><body>'+
    c.outerHTML+'<div class="ppz" id="ppz"><img alt=""></div>'+
    '<scr'+'ipt>'+ZJS+'</scr'+'ipt></body></html>';
  const blob=new Blob([html],{type:"text/html;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=ref.replace(/[^A-Za-z0-9._-]+/g,"_")+".html";
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1500);
}

function pageVerify(){
  const steps=[
    [L("السجل الحكومي الصيني","The Chinese government registry"),"NATIONAL ENTERPRISE CREDIT REGISTRY",
     L("منصة رسمية تابعة لهيئة تنظيم السوق الصينية، مجانية ومفتوحة للجميع، وفيها كل شركة مسجَّلة في الصين. الواجهة بالصينية فقط — لا توجد نسخة إنجليزية رسمية، وأي موقع يسمّي نفسه «GSXT بالإنجليزية» هو وسيط تجاري لا جهة حكومية.","An official platform of China's market regulator, free and open to anyone, covering every registered company in China. The interface is Chinese only — there is no official English version, and any site calling itself \"GSXT in English\" is a commercial reseller, not a government body."),
     L("ابحث بالاسم الصيني للشركة أو برمز الائتمان الموحّد. اطلب من المورّد اسمه الصيني كما هو في الرخصة — لا الاسم الإنجليزي التجاري.","Search by the company's Chinese name or its Unified Social Credit Code. Ask the supplier for the Chinese name exactly as it appears on the licence — not the English trading name.")],
    [L("رمز الائتمان الاجتماعي الموحّد","The Unified Social Credit Code"),"18-CHARACTER USCC",
     L("ثمانية عشر خانة من أرقام وحروف كبيرة، ولا تُستخدم فيها الحروف I و O و Z و S و V. الخانة الأولى تدل على جهة التسجيل، و«9» تعني هيئة تنظيم السوق. الخانات من الثالثة إلى الثامنة ترمز للمنطقة الإدارية.","Eighteen characters of digits and capital letters, never using I, O, Z, S or V. The first character is the registering authority, where 9 means the market regulator. Characters three to eight encode the administrative region."),
     L("رمز يبدأ بـ 91 هو شركة عادية مسجَّلة لدى هيئة تنظيم السوق. وإن قال المورّد إنه في شنتشن بينما ترمز خاناته إلى إقليم آخر، فاسأل عن السبب قبل أن تكمل.","A code starting 91 is an ordinary company registered with the market regulator. If the supplier says Shenzhen but the code encodes a different province, ask why before you go further.")],
    [L("الرخصة التجارية — وامسح رمز QR","The business licence — and scan the QR code"),"BUSINESS LICENCE",
     L("الرخصة التجارية النظامية تحمل: الاسم، رمز الائتمان الموحّد، نوع الكيان، رأس المال المسجَّل، المقر، الممثل القانوني، نطاق الأعمال، جهة التسجيل، وتاريخ التأسيس. والرخص الصادرة منذ مارس 2019 تحمل رمز QR يربط مباشرة بسجل الشركة في المنصة الحكومية.","A compliant licence carries: the name, the USCC, the entity type, registered capital, domicile, legal representative, business scope, registering authority and date of establishment. Licences issued since March 2019 carry a QR code linking directly to the company's record on the government platform."),
     L("امسح رمز QR وقارن الاسم والرمز حرفًا بحرف مع المطبوع على الورقة — هذا أقوى فحص لديك ضد رخصة معدَّلة بالفوتوشوب. وملاحظة تمنع سوء الفهم: «مدة العمل» حُذفت من واجهة الرخص الصادرة بعد 1 سبتمبر 2022، فوجودها في رخصة لا يعني تزويرًا، بل يعني أنها رخصة أقدم.","Scan the QR code and compare the name and code character by character with what is printed on the page — this is your strongest check against a photoshopped licence. And a note that prevents a misunderstanding: the term of operation was removed from licences issued after 1 September 2022, so seeing it does not mean forgery, only that the licence is older.")],
    [L("رأس المال: انظر المدفوع لا المسجَّل","Capital: read the paid-in figure, not the registered one"),"PAID-IN vs SUBSCRIBED",
     L("منذ إصلاح 2014 صار رأس المال المسجَّل «مكتتبًا» لا «مدفوعًا» — أي وعد من الشركاء، لا مال موجود. فشركة برأس مال 50 مليون يوان قد لا يكون فيها شيء فعليًا.","Since the 2014 reform, registered capital is subscribed rather than paid in — a promise by the shareholders, not money that exists. A company showing RMB 50 million may have nothing actually paid."),
     L("ومنذ يوليو 2024 صارت المنصة الحكومية تنشر المبلغ المدفوع فعليًا إلى جانب المكتتب. هذا هو الرقم الذي يعني شيئًا. وقانون الشركات الجديد النافذ في 1 يوليو 2024 يلزم بسداد رأس المال خلال خمس سنوات، والشركات القائمة قبله أمامها مهلة حتى 30 يونيو 2027 — فالمورّد ذو الاكتتاب الضخم والسداد الصفري على ساعة تعدّ.","Since July 2024 the government platform publishes the amount actually paid in alongside the subscribed amount. That is the number that means something. The new Company Law, in force 1 July 2024, requires capital to be paid within five years, and companies formed earlier have until 30 June 2027 — so a supplier with a large subscription and nothing paid is on a clock.")],
    [L("مصنع أم وسيط؟","Factory or trader?"),"MANUFACTURER OR MIDDLEMAN",
     L("نطاق الأعمال إشارة تعمل في اتجاه واحد فقط: غياب أي ذكر للإنتاج أو التصنيع أو المعالجة يعني على الأرجح أنك أمام شركة تجارية. لكن وجود كلمات البيع والتجارة لا ينفي المصنع إطلاقًا — أغلب المصانع الحقيقية تسجّل التصنيع والبيع والاستيراد والتصدير معًا.","Business scope is a one-directional signal: the absence of any mention of production, manufacturing or processing usually means you are looking at a trading company. But the presence of sales and trading words does not rule out a factory at all — most real factories register manufacturing, sales and import-export together."),
     L("إشارات أفضل من نطاق الأعمال: نوع العنوان المسجَّل (مجمع صناعي أم برج مكاتب أم شقة)، وعدد الموظفين في التقرير السنوي، واسم الجهة المدوَّن على شهادات المنتج. وانتبه: من الطبيعي أن يكون المصنع كيانًا وشركة التصدير كيانًا آخر برمز مختلف — الطبيعي أن تعرف أي كيان في العقد وأي كيان يستلم المال.","Better signals than business scope: the type of registered address (industrial park, office tower or apartment), the headcount in the annual report, and which entity's name appears on the product certificates. And note: it is normal for the factory and the exporting company to be two entities with different codes — what matters is knowing which one is on the contract and which one receives the money.")],
    [L("حق التصدير — معلومة قديمة يجب تصحيحها","Export rights — an outdated instruction to unlearn"),"THE RIGHT TO EXPORT",
     L("«تسجيل مشغّل التجارة الخارجية» الذي تطلبه أغلب الأدلة العربية أُلغي في 30 ديسمبر 2022 مع تعديل قانون التجارة الخارجية. فالشهادة القديمة إن وُجدت لدى المورّد صارت وثيقة تاريخية لا تثبت شيئًا اليوم.","The foreign trade operator filing that most Arabic guides still ask for was abolished on 30 December 2022 with the amendment of the Foreign Trade Law. If a supplier still holds that old certificate, it is a historical document that proves nothing today."),
     L("المطلوب في 2026: رخصة عمل سارية، وتسجيل لدى الجمارك الصينية كمرسِل للبضائع (سارٍ منذ 1 يناير 2022). ويمكنك التحقق من ذلك بنفسك على منصة الجمارك لنشر معلومات ائتمان الشركات — وهي فحص مستقل عن السجل التجاري: شركة قد تكون سليمة في السجل ولا تملك تسجيلًا جمركيًا، فلا تصلح أن تكون المصدِّر في مستنداتك.","What is required in 2026: a valid business licence, and a customs filing as a consignor of import-export goods (in force since 1 January 2022). You can check this yourself on the customs credit disclosure platform — a check separate from the business registry: a company can be perfectly valid on the registry and still have no customs filing, which means it cannot be the exporter on your documents.")],
    [L("إن لم يكن للمورّد حق تصدير","If the supplier has no export rights"),"WHO IS THE EXPORTER OF RECORD",
     L("هذه حالة شائعة جدًا مع مورّدي المنصات المحلية الصينية. المسار السليم هو وكيل تصدير بعقد مكتوب، ويبقى المصنع هو المسؤول الأساسي، ويتحمل مقدّم الخدمة مسؤولية تضامنية.","This is very common with suppliers from China's domestic platforms. The sound route is an export agent under a written contract, where the manufacturer remains the primary responsible party and the service company carries joint liability."),

  const badges=[

    [L("اسم المستفيد لا يطابق العقد","The beneficiary name does not match the contract"),
     L("هذه أخطر نقطة في الصفحة كلها. اسم المستفيد في التحويل يجب أن يطابق حرفًا بحرف اسم الشركة في العقد وفي الرخصة. لا حساب شخصي لمدير المبيعات، ولا شركة في هونغ كونغ باسم مشابه، ولا «شركة مالية» وسيطة. وإن قيل لك إن حساب الشركة «تحت التدقيق» أو «مجمّد» أو «قيد التغيير» أو إن الحساب الشخصي «يوفّر الضريبة» — عاملها كاحتيال حتى يثبت العكس.","This is the most serious point on this page. The beneficiary name on the transfer must match, character for character, the company name on the contract and on the licence. Not the sales manager's personal account, not a Hong Kong entity with a similar name, not an intermediary finance company. And if you are told the company account is under audit, frozen or being changed, or that a personal account avoids tax, treat it as fraud until proven otherwise.")],
    [L("تغيير بيانات البنك في منتصف الطلب","Bank details changed mid-order"),
     L("هذه بالضبط آلية أشهر جرائم الاحتيال في التجارة الدولية: يُخترق بريد المورّد أو يُسجَّل نطاق شبيه، فتصلك بيانات بنكية «محدَّثة». مكتب التحقيقات الفيدرالي يوصي صراحة بالتحقق من أي تغيير في رقم الحساب أو إجراءات الدفع مع الشخص نفسه. تحقق بمكالمة صوتية على رقم كان لديك من قبل — لا رقم مكتوب في الرسالة الجديدة.","This is exactly the mechanism behind the best-known fraud in international trade: the supplier's mailbox is compromised or a lookalike domain is registered, and updated bank details arrive. The FBI recommends explicitly verifying any change of account number or payment procedure with the person making the request. Verify by voice call on a number you already had — never one written in the new message.")],

/* mirrors NOINDEX in build.py: these must never flip to index,follow after hydration */
const NOINDEX = new Set(["/thanks"]);

const META404 = () => [["الصفحة غير موجودة — Eternal Silk","Page not found — Eternal Silk"],
                       ["الرابط الذي فتحته غير موجود. تصفّح خدماتنا أو الصفقات الجاهزة أو تواصل معنا.",
                        "The link you opened does not exist. Browse our services, the ready deals, or get in touch."]];
function setMeta(base, slug){
  let m = META[base] || (base==="/"||base==="" ? META["/"] : META404());
  let url = "https://"+CFG.domain+(base==="/"?"/":base);
  let indexable = (!!META[base] || base==="/" || base==="") && !NOINDEX.has(base);
  /* every deal is its own page: its own title, description and canonical */
  if(base==="/deal"){
    const d = slug && (window.DEALS||[]).find(x=>x.id===slug);
    if(d && d.title){ m = [[d.title[0]+" — Eternal Silk", d.title[1]+" — Eternal Silk"], [d.hook||d.title[0], d.hook||d.title[1]]];
           url = "https://"+CFG.domain+"/deal/"+d.id; }
    else if(LIVE!==null){ m = META404(); indexable = false; }
  }
  document.title = A(m[0]);
  const set=(sel,val)=>{const e=document.querySelector(sel); if(e) e.setAttribute("content",val);};
  set('meta[name="description"]',A(m[1]));
  set('meta[property="og:title"]',A(m[0]));
  set('meta[property="og:description"]',A(m[1]));
  set('meta[name="twitter:title"]',A(m[0]));
  set('meta[name="twitter:description"]',A(m[1]));
  /* canonical and og:url were static on every route */
  const c=document.querySelector('link[rel="canonical"]'); if(c) c.href=url;
  set('meta[property="og:url"]',url);
  /* an unknown route must not be indexed as a duplicate of the homepage */
  const rb=document.querySelector('meta[name="robots"]');
  if(rb) rb.setAttribute("content", indexable ? "index,follow" : "noindex,follow");
}

function reveal(){
  const els=document.querySelectorAll(".rv:not(.in)");
  if(!("IntersectionObserver" in window)){els.forEach(e=>e.classList.add("in"));return;}
  const io=new IntersectionObserver((en)=>en.forEach(x=>{if(x.isIntersecting){x.target.classList.add("in");io.unobserve(x.target);}}),{threshold:.12});
  els.forEach(e=>io.observe(e));
}

/* Real URLs, client-side. Same-origin internal links are intercepted so
   navigation stays instant, while every link remains a genuine href that a
   crawler can follow and a visitor can copy, bookmark or open in a new tab. */
function go(path,replace){
  const cur=location.pathname+location.search+location.hash;
  if(path===cur) return;
  history[replace?"replaceState":"pushState"]({},"",path);
  render();
}
document.addEventListener("click",e=>{
  if(e.defaultPrevented||e.button!==0||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey) return;
  const a=e.target.closest && e.target.closest("a[href]");
  if(!a||a.target==="_blank"||a.hasAttribute("download")) return;
  const href=a.getAttribute("href");
  if(!href||href.startsWith("#")||/^[a-z]+:/i.test(href)) return;
  const u=new URL(href,location.href);
  if(u.origin!==location.origin) return;
  e.preventDefault();
  go(u.pathname+u.search+u.hash);
});
window.addEventListener("popstate",render);
